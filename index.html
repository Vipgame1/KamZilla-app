<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>KamZilla — Download APK</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;600;700;800;900&display=swap"
      rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:'Outfit',sans-serif;
    background:#020611;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    perspective:1400px;
}

/* =========================================================
   MAIN 3D WORLD
========================================================= */

.scene{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 15%,rgba(45,105,255,.30),transparent 35%),
        linear-gradient(180deg,#020719 0%,#06132e 48%,#071a2d 100%);
    z-index:-20;
}

/* BLUE LIGHT GLOW */

.scene::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    left:50%;
    top:8%;
    transform:translateX(-50%);
    background:radial-gradient(circle,
        rgba(50,120,255,.20),
        rgba(50,120,255,.08) 35%,
        transparent 70%);
    filter:blur(10px);
}

/* =========================================================
   STARS
========================================================= */

.stars{
    position:absolute;
    inset:0;
    opacity:.65;
    background-image:
        radial-gradient(circle at 10% 15%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 22% 35%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 35% 12%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 50% 25%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 68% 13%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 82% 32%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 92% 10%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 15% 55%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 78% 58%,#fff 0 1px,transparent 2px);

    animation:starsMove 6s ease-in-out infinite;
}

@keyframes starsMove{
    0%,100%{opacity:.45}
    50%{opacity:.9}
}

/* =========================================================
   CITY
========================================================= */

.city{
    position:absolute;
    left:-5%;
    right:-5%;
    bottom:-5px;
    height:42%;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:4px;
    perspective:900px;
    transform:rotateX(3deg);
}

.building{
    position:relative;
    width:32px;
    background:
        linear-gradient(90deg,
        #050b18,
        #101d3c 50%,
        #050b18);
    border:1px solid rgba(79,137,255,.18);
    box-shadow:
        inset 0 0 20px rgba(42,105,255,.08),
        0 -5px 25px rgba(30,90,255,.08);
    transform-origin:bottom;
}

/* windows */

.building::after{
    content:"";
    position:absolute;
    inset:10px 6px;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(85,155,255,.30) 0px,
            rgba(85,155,255,.30) 2px,
            transparent 2px,
            transparent 10px
        );
    opacity:.65;
}

/* building sizes */

.b1{height:115px}
.b2{height:170px}
.b3{height:90px}
.b4{height:210px}
.b5{height:135px}
.b6{height:250px}
.b7{height:155px}
.b8{height:105px}
.b9{height:190px}
.b10{height:130px}
.b11{height:225px}
.b12{height:150px}

/* =========================================================
   CROWD
========================================================= */

.crowd{
    position:absolute;
    bottom:20%;
    left:0;
    width:100%;
    height:190px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:5px;
    z-index:2;
    transform:perspective(700px) rotateX(5deg);
}

.person{
    position:relative;
    width:24px;
    height:90px;
    opacity:.82;
    filter:drop-shadow(0 0 7px rgba(59,130,246,.20));
    animation:peopleMove 3s ease-in-out infinite;
}

.person .head{
    position:absolute;
    width:17px;
    height:17px;
    border-radius:50%;
    left:50%;
    top:0;
    transform:translateX(-50%);
    background:linear-gradient(145deg,#5b7db8,#17284e);
}

.person .body{
    position:absolute;
    left:50%;
    top:18px;
    width:25px;
    height:52px;
    transform:translateX(-50%);
    border-radius:12px 12px 5px 5px;
    background:linear-gradient(
        90deg,
        #071024,
        #173a75,
        #071024
    );
}

.person .arm1,
.person .arm2{
    position:absolute;
    top:25px;
    width:7px;
    height:42px;
    border-radius:5px;
    background:#10244a;
}

.person .arm1{
    left:1px;
    transform:rotate(18deg);
}

.person .arm2{
    right:1px;
    transform:rotate(-18deg);
}

.person .leg1,
.person .leg2{
    position:absolute;
    top:66px;
    width:8px;
    height:28px;
    border-radius:4px;
    background:#071126;
}

.person .leg1{
    left:5px;
    transform:rotate(4deg);
}

.person .leg2{
    right:5px;
    transform:rotate(-4deg);
}

@keyframes peopleMove{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-4px);
    }
}

/* =========================================================
   FLOATING LIGHTS
========================================================= */

.light{
    position:absolute;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#3b82f6;
    box-shadow:
        0 0 10px #3b82f6,
        0 0 30px #3b82f6;
    animation:lightFloat 5s linear infinite;
}

.light:nth-child(2){
    background:#22c55e;
    box-shadow:0 0 10px #22c55e,0 0 30px #22c55e;
}

.light:nth-child(3){
    background:#a855f7;
    box-shadow:0 0 10px #a855f7,0 0 30px #a855f7;
}

@keyframes lightFloat{
    0%{
        transform:translateY(120px) scale(.5);
        opacity:0;
    }
    30%{opacity:1}
    70%{opacity:.8}
    100%{
        transform:translateY(-300px) scale(1.2);
        opacity:0;
    }
}

/* =========================================================
   FIREWORKS
========================================================= */

.firework{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    animation:firework 2.5s infinite;
}

.fw1{
    left:13%;
    top:18%;
    background:#3b82f6;
    box-shadow:0 0 15px #3b82f6,0 0 40px #3b82f6;
}

.fw2{
    right:15%;
    top:25%;
    background:#22c55e;
    box-shadow:0 0 15px #22c55e,0 0 40px #22c55e;
    animation-delay:.7s;
}

.fw3{
    left:50%;
    top:10%;
    background:#a855f7;
    box-shadow:0 0 15px #a855f7,0 0 40px #a855f7;
    animation-delay:1.2s;
}

.fw4{
    left:80%;
    top:12%;
    background:#facc15;
    box-shadow:0 0 15px #facc15,0 0 40px #facc15;
    animation-delay:1.7s;
}

@keyframes firework{
    0%,100%{
        transform:scale(.2);
        opacity:.2;
    }
    40%{
        transform:scale(1);
        opacity:1;
    }
    70%{
        transform:scale(2.8);
        opacity:.6;
    }
}

/* =========================================================
   MAIN CARD
========================================================= */

.card-container{
    width:100%;
    max-width:390px;
    padding:18px;
    z-index:20;
    transform-style:preserve-3d;
    transition:transform .15s ease;
}

.glass-card{
    position:relative;
    padding:34px 23px 25px;
    border-radius:35px;

    background:
        linear-gradient(
            145deg,
            rgba(22,35,73,.88),
            rgba(5,12,28,.92)
        );

    border:1px solid rgba(110,155,255,.25);

    box-shadow:
        0 40px 90px rgba(0,0,0,.75),
        0 0 70px rgba(37,99,235,.18),
        inset 0 1px 0 rgba(255,255,255,.12);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    transform-style:preserve-3d;
}

/* CARD GLOW */

.glass-card::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:37px;
    background:linear-gradient(
        120deg,
        transparent,
        rgba(59,130,246,.7),
        rgba(139,92,246,.6),
        transparent
    );
    z-index:-1;
    opacity:.55;
    filter:blur(5px);
}

/* top line */

.glass-card::after{
    content:"";
    position:absolute;
    top:0;
    left:12%;
    right:12%;
    height:2px;
    background:linear-gradient(
        90deg,
        transparent,
        #3b82f6,
        #8b5cf6,
        transparent
    );
    box-shadow:0 0 15px #3b82f6;
}

/* =========================================================
   3D REAL IMAGE ICON
========================================================= */

.app-icon-wrapper{
    position:relative;
    width:105px;
    height:105px;
    margin:0 auto 22px;

    border-radius:24px;

    transform:
        translateZ(80px)
        rotateX(7deg)
        rotateY(-7deg);

    transform-style:preserve-3d;

    animation:
        iconFloat 4s ease-in-out infinite;

    background:#0b1630;

    border:2px solid rgba(96,165,250,.7);

    box-shadow:
        0 22px 40px rgba(0,0,0,.65),
        0 0 35px rgba(59,130,246,.45),
        inset 0 2px 4px rgba(255,255,255,.35);
}

/* 3D bottom side */

.app-icon-wrapper::after{
    content:"";
    position:absolute;
    left:7px;
    right:-7px;
    bottom:-8px;
    height:100%;
    border-radius:24px;
    background:linear-gradient(
        145deg,
        #173d91,
        #07132e
    );
    transform:translateZ(-12px);
    z-index:-1;
    opacity:.9;
}

/* image */

.app-icon-wrapper img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    border-radius:21px;
}

/* shine */

.app-icon-wrapper::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:21px;
    background:linear-gradient(
        135deg,
        rgba(255,255,255,.28),
        transparent 35%,
        transparent 70%,
        rgba(255,255,255,.08)
    );
    z-index:2;
    pointer-events:none;
}

@keyframes iconFloat{
    0%,100%{
        transform:
            translateZ(80px)
            translateY(0)
            rotateX(7deg)
            rotateY(-7deg);
    }

    50%{
        transform:
            translateZ(100px)
            translateY(-10px)
            rotateX(4deg)
            rotateY(7deg);
    }
}

/* =========================================================
   APP NAME
========================================================= */

.app-name{
    font-size:2.35rem;
    line-height:1;
    font-weight:900;
    letter-spacing:2px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #9bc5ff,
            #ffffff,
            #8ea8ff
        );

    background-size:250% auto;

    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:textShine 4s linear infinite;

    text-shadow:
        0 12px 30px rgba(59,130,246,.35);

    transform:translateZ(45px);
}

@keyframes textShine{
    to{
        background-position:250% center;
    }
}

/* =========================================================
   BADGES
========================================================= */

.badge{
    display:inline-flex;
    align-items:center;
    gap:5px;

    padding:6px 12px;
    border-radius:20px;

    font-size:.72rem;
    font-weight:700;

    background:rgba(16,185,129,.12);
    color:#5ee7b7;

    border:1px solid rgba(16,185,129,.30);

    box-shadow:
        0 0 15px rgba(16,185,129,.08);

    transform:translateZ(25px);
}

/* =========================================================
   FEATURES
========================================================= */

.feature-item{
    display:flex;
    align-items:center;
    gap:14px;

    padding:13px 15px;

    border-radius:17px;

    background:
        linear-gradient(
            100deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.07);

    transform:translateZ(25px);

    box-shadow:
        inset 0 1px rgba(255,255,255,.04),
        0 8px 20px rgba(0,0,0,.15);

    transition:.3s;
}

.feature-item:active{
    transform:
        translateZ(25px)
        scale(.98);
}

/* =========================================================
   DOWNLOAD BUTTON
========================================================= */

.btn-3d-container{
    margin-top:27px;
    transform:translateZ(55px);
}

.btn-3d{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    width:100%;
    padding:18px;

    border-radius:21px;

    color:white;
    text-decoration:none;

    font-size:1.18rem;
    font-weight:900;
    letter-spacing:1px;

    background:
        linear-gradient(
            180deg,
            #5598ff 0%,
            #2461df 48%,
            #1746b8 100%
        );

    border:1px solid #7db2ff;

    box-shadow:
        0 10px 0 #102d72,
        0 20px 35px rgba(37,99,235,.42),
        inset 0 2px 3px rgba(255,255,255,.45);

    overflow:hidden;

    transition:.15s;
}

/* shine */

.btn-3d::before{
    content:"";
    position:absolute;
    top:-100%;
    left:-40%;
    width:35%;
    height:300%;

    background:rgba(255,255,255,.35);

    transform:rotate(25deg);

    animation:buttonShine 3.5s infinite;
}

@keyframes buttonShine{
    0%{
        left:-50%;
    }

    55%,100%{
        left:140%;
    }
}

.btn-3d:active{
    transform:translateY(8px);

    box-shadow:
        0 2px 0 #102d72,
        0 8px 15px rgba(37,99,235,.35),
        inset 0 2px 3px rgba(255,255,255,.35);
}

/* =========================================================
   VERIFIED
========================================================= */

.verified{
    margin-top:20px;

    font-size:9px;
    font-weight:800;
    letter-spacing:2px;

    color:#71809e;
}

.verified i{
    color:#22c55e;
    margin-right:5px;
    filter:drop-shadow(0 0 5px #22c55e);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-height:720px){

    .card-container{
        transform:scale(.86);
    }

}

@media(max-height:650px){

    .card-container{
        transform:scale(.76);
    }

}

@media(min-width:600px){

    .card-container{
        max-width:430px;
    }

}

</style>
</head>

<body>

<script>

/* =========================================================
   CREATE MANY PEOPLE
========================================================= */

const crowd = document.getElementById("crowd");

for(let i=0;i<25;i++){

    const person=document.createElement("div");

    person.className="person";

    person.style.height =
        (70 + Math.random()*45) + "px";

    person.style.transform =
        `scale(${0.7 + Math.random()*0.65})`;

    person.style.animationDelay =
        (Math.random()*3) + "s";

    person.innerHTML=`

        <div class="head"></div>

        <div class="body"></div>

        <div class="arm1"></div>

        <div class="arm2"></div>

        <div class="leg1"></div>

        <div class="leg2"></div>

    `;

    crowd.appendChild(person);
}


/* =========================================================
   3D TILT
========================================================= */

const card =
    document.getElementById("tiltCard");

const container =
    document.querySelector(".card-container");


function tilt(x,y){

    const rect =
        card.getBoundingClientRect();

    const centerX =
        rect.width / 2;

    const centerY =
        rect.height / 2;

    const rotateX =
        ((y-centerY)/centerY)*-7;

    const rotateY =
        ((x-centerX)/centerX)*7;

    container.style.transform =
        `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
}


/* PC */

card.addEventListener("mousemove",(e)=>{

    const rect =
        card.getBoundingClientRect();

    tilt(
        e.clientX-rect.left,
        e.clientY-rect.top
    );

});


card.addEventListener("mouseleave",()=>{

    container.style.transform =
        "rotateX(0deg) rotateY(0deg)";

});


/* MOBILE */

card.addEventListener(
    "touchmove",
    (e)=>{

        const touch=e.touches[0];

        const rect =
            card.getBoundingClientRect();

        tilt(
            touch.clientX-rect.left,
            touch.clientY-rect.top
        );

    },
    {passive:true}
);


card.addEventListener(
    "touchend",
    ()=>{

        container.style.transform =
            "rotateX(0deg) rotateY(0deg)";

    }
);

</script>
