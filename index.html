<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<meta name="theme-color" content="#050b1d">

<title>KamZilla - Download APK</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
rel="stylesheet">


<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;

    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{

    font-family:'Outfit',sans-serif;

    background:#020611;

    color:white;

    display:flex;

    justify-content:center;
    align-items:center;

    perspective:1600px;
}


/* =========================================================
   BACKGROUND WORLD
========================================================= */

.world{

    position:fixed;

    inset:0;

    overflow:hidden;

    z-index:-20;

    background:

    radial-gradient(
        circle at 50% 5%,
        rgba(42,105,255,.35),
        transparent 30%
    ),

    radial-gradient(
        circle at 0% 65%,
        rgba(0,210,170,.16),
        transparent 30%
    ),

    radial-gradient(
        circle at 100% 55%,
        rgba(126,72,255,.18),
        transparent 30%
    ),

    linear-gradient(
        180deg,
        #020511 0%,
        #071333 45%,
        #06182a 100%
    );
}


/* =========================================================
   GLOW
========================================================= */

.glow{

    position:absolute;

    border-radius:50%;

    filter:blur(70px);

    pointer-events:none;
}

.glow1{

    width:280px;
    height:280px;

    left:-130px;
    top:30%;

    background:#1266ff;

    opacity:.25;
}

.glow2{

    width:260px;
    height:260px;

    right:-130px;
    top:45%;

    background:#7c3aed;

    opacity:.25;
}

.glow3{

    width:200px;
    height:200px;

    left:35%;
    bottom:-100px;

    background:#00c896;

    opacity:.18;
}


/* =========================================================
   STARS
========================================================= */

.stars{

    position:absolute;

    inset:0;

    opacity:.6;

    background-image:

    radial-gradient(
        circle at 5% 10%,
        white 0 1px,
        transparent 2px
    ),

    radial-gradient(
        circle at 15% 28%,
        white 0 1px,
        transparent 2px
    ),

    radial-gradient(
        circle at 25% 8%,
        white 0 1px,
        transparent 2px
    ),

    radial-gradient(
        circle at 35% 18%,
        white 0 1px,
        transparent 2px
    ),

    radial-gradient(
        circle at 48% 9%,
        white 0 1px,
        transparent 2px
    ),

    radial-gradient(
        circle at 60% 25%,
        white 0 1px,
        transparent 2px
    ),

    radial-gradient(
        circle at 72% 10%,
        white 0 1px,
        transparent 2px
    ),

    radial-gradient(
        circle at 85% 22%,
        white 0 1px,
        transparent 2px
    ),

    radial-gradient(
        circle at 95% 8%,
        white 0 1px,
        transparent 2px
    );

    animation:starBlink 4s infinite;
}

@keyframes starBlink{

    0%,100%{
        opacity:.35;
    }

    50%{
        opacity:.8;
    }

}


/* =========================================================
   CITY
========================================================= */

.city{

    position:absolute;

    bottom:0;

    left:-5%;

    width:110%;

    height:35%;

    display:flex;

    align-items:flex-end;

    justify-content:center;

    gap:4px;

    transform:
        perspective(900px)
        rotateX(5deg);

    opacity:.9;
}

.building{

    position:relative;

    width:27px;

    background:

    linear-gradient(
        90deg,
        #020817,
        #132c59,
        #030917
    );

    border:

    1px solid
    rgba(79,140,255,.18);

    border-radius:
        4px 4px 0 0;

    box-shadow:

        inset 0 0 20px
        rgba(43,111,255,.12),

        0 -5px 20px
        rgba(37,99,235,.08);
}

.building::before{

    content:"";

    position:absolute;

    left:5px;
    right:5px;

    top:10px;
    bottom:8px;

    background:

    repeating-linear-gradient(
        to bottom,
        rgba(90,160,255,.5) 0px,
        rgba(90,160,255,.5) 2px,
        transparent 2px,
        transparent 10px
    );

    opacity:.65;
}

.building::after{

    content:"";

    position:absolute;

    top:0;

    left:50%;

    width:2px;
    height:12px;

    transform:
        translateX(-50%);

    background:#4d9aff;

    box-shadow:
        0 0 10px #4d9aff;
}

.b1{height:90px}
.b2{height:150px}
.b3{height:115px}
.b4{height:185px}
.b5{height:125px}
.b6{height:220px}
.b7{height:160px}
.b8{height:100px}
.b9{height:205px}
.b10{height:135px}
.b11{height:175px}
.b12{height:115px}
.b13{height:235px}
.b14{height:145px}
.b15{height:195px}
.b16{height:125px}


/* =========================================================
   CROWD
========================================================= */

.crowd{

    position:absolute;

    bottom:18%;

    left:0;
    right:0;

    height:140px;

    display:flex;

    align-items:flex-end;

    justify-content:center;

    gap:4px;

    transform:
        perspective(700px)
        rotateX(5deg);

    opacity:.85;
}

.person{

    position:relative;

    width:22px;

    height:92px;

    animation:
        personFloat
        3s
        ease-in-out
        infinite;
}

.person:nth-child(2n){
    animation-delay:.5s;
}

.person:nth-child(3n){
    animation-delay:1s;
}

.head{

    position:absolute;

    width:15px;
    height:15px;

    top:0;
    left:50%;

    transform:
        translateX(-50%);

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #7594c9,
            #1b2c4f
        );
}

.body{

    position:absolute;

    width:25px;
    height:51px;

    top:17px;
    left:50%;

    transform:
        translateX(-50%);

    border-radius:
        13px 13px 5px 5px;

    background:
        linear-gradient(
            90deg,
            #050b19,
            #19396e,
            #050b19
        );
}

.arm{

    position:absolute;

    top:25px;

    width:5px;
    height:39px;

    border-radius:5px;

    background:#13284c;
}

.arm.left{

    left:0;

    transform:
        rotate(18deg);
}

.arm.right{

    right:0;

    transform:
        rotate(-18deg);
}

.leg{

    position:absolute;

    top:66px;

    width:7px;
    height:28px;

    border-radius:5px;

    background:#050b18;
}

.leg.left{
    left:5px;
}

.leg.right{
    right:5px;
}

@keyframes personFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }

}


/* =========================================================
   PARTICLES
========================================================= */

.particle{

    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#3b82f6;

    box-shadow:
        0 0 12px #3b82f6;

    animation:
        particleUp
        6s
        linear
        infinite;
}

.particle.green{

    background:#10b981;

    box-shadow:
        0 0 12px #10b981;
}

.particle.purple{

    background:#a855f7;

    box-shadow:
        0 0 12px #a855f7;
}

@keyframes particleUp{

    0%{

        transform:
            translateY(100px)
            scale(.3);

        opacity:0;
    }

    25%{
        opacity:1;
    }

    100%{

        transform:
            translateY(-500px)
            scale(1.2);

        opacity:0;
    }

}


/* =========================================================
   FIREWORKS
========================================================= */

.firework{

    position:absolute;

    width:6px;
    height:6px;

    border-radius:50%;

    animation:
        fireworkAnim
        3s
        infinite;
}

.fw1{

    left:12%;
    top:16%;

    background:#3b82f6;

    box-shadow:
        0 0 15px #3b82f6,
        0 0 35px #3b82f6;
}

.fw2{

    right:14%;
    top:22%;

    background:#22c55e;

    box-shadow:
        0 0 15px #22c55e,
        0 0 35px #22c55e;

    animation-delay:.8s;
}

.fw3{

    left:52%;
    top:9%;

    background:#a855f7;

    box-shadow:
        0 0 15px #a855f7,
        0 0 35px #a855f7;

    animation-delay:1.4s;
}

@keyframes fireworkAnim{

    0%,100%{
        transform:scale(.2);
        opacity:.2;
    }

    40%{
        transform:scale(1);
        opacity:1;
    }

    65%{
        transform:scale(3);
        opacity:.5;
    }

}


/* =========================================================
   MAIN CARD
========================================================= */

.card-container{

    width:100%;

    max-width:395px;

    padding:15px;

    transform-style:preserve-3d;

    transition:
        transform .18s ease;

    z-index:30;
}

.glass-card{

    position:relative;

    padding:
        27px 22px 20px;

    border-radius:34px;

    background:

    linear-gradient(
        145deg,
        rgba(15,31,69,.94),
        rgba(3,9,25,.96)
    );

    border:
        1px solid
        rgba(113,159,255,.28);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    transform-style:preserve-3d;

    box-shadow:

        0 40px 80px
        rgba(0,0,0,.85),

        0 0 80px
        rgba(37,99,235,.16),

        inset 0 1px 0
        rgba(255,255,255,.15),

        inset 0 -1px 0
        rgba(0,0,0,.7);
}

.glass-card::before{

    content:"";

    position:absolute;

    inset:-2px;

    border-radius:36px;

    background:

    linear-gradient(
        120deg,
        transparent,
        rgba(59,130,246,.7),
        rgba(139,92,246,.65),
        transparent
    );

    opacity:.35;

    filter:blur(5px);

    z-index:-1;
}

.glass-card::after{

    content:"";

    position:absolute;

    top:0;

    left:12%;
    right:12%;

    height:2px;

    background:

    linear-gradient(
        90deg,
        transparent,
        #3b82f6,
        #9b5cff,
        transparent
    );

    box-shadow:
        0 0 16px #3b82f6;
}


/* =========================================================
   REAL IMAGE 3D FRAME
========================================================= */

.app-logo-3d{

    position:relative;

    width:125px;
    height:125px;

    margin:
        0 auto 23px;

    transform-style:preserve-3d;

    transform:

        perspective(900px)

        rotateX(7deg)
        rotateY(-8deg)

        translateZ(70px);

    animation:
        logoFloat
        4s
        ease-in-out
        infinite;

    filter:

        drop-shadow(
            0 25px 25px
            rgba(0,0,0,.7)
        )

        drop-shadow(
            0 0 25px
            rgba(37,99,235,.55)
        );
}


/* FRONT FRAME */

.logo-face{

    position:absolute;

    inset:0;

    border-radius:25px;

    overflow:hidden;

    background:#07132d;

    border:
        2px solid
        rgba(110,178,255,.9);

    transform:
        translateZ(15px);

    box-shadow:

        inset 0 2px 5px
        rgba(255,255,255,.45),

        inset 0 -15px 25px
        rgba(0,0,0,.45);

    z-index:10;
}


/* REAL USER IMAGE */

.logo-face img{

    display:block;

    width:100%;
    height:100%;

    object-fit:contain;

    object-position:center;

    background:#07132d;

    border-radius:22px;

    opacity:1;

    visibility:visible;

    position:relative;

    z-index:20;
}


/* GLASS SHINE */

.logo-shine{

    position:absolute;

    inset:0;

    z-index:30;

    pointer-events:none;

    border-radius:23px;

    background:

    linear-gradient(
        135deg,
        rgba(255,255,255,.24),
        transparent 30%,
        transparent 70%,
        rgba(255,255,255,.08)
    );
}


/* 3D RIGHT DEPTH */

.logo-side{

    position:absolute;

    top:7px;

    right:-14px;

    width:16px;

    height:110px;

    border-radius:
        0 15px 15px 0;

    background:

    linear-gradient(
        90deg,
        #2d73ed,
        #061636
    );

    border:
        1px solid
        rgba(100,170,255,.5);

    transform:

        rotateY(90deg)
        translateZ(7px);

    transform-origin:left center;

    z-index:1;
}


/* 3D TOP */

.logo-top{

    position:absolute;

    top:-14px;

    left:8px;

    width:108px;

    height:16px;

    border-radius:
        15px 15px 0 0;

    background:

    linear-gradient(
        180deg,
        #72adff,
        #2055b9
    );

    transform:

        rotateX(90deg)
        translateZ(7px);

    transform-origin:center bottom;

    z-index:1;
}


/* LOGO FLOAT */

@keyframes logoFloat{

    0%,100%{

        transform:

            perspective(900px)

            rotateX(7deg)
            rotateY(-8deg)

            translateY(0)
            translateZ(70px);
    }

    50%{

        transform:

            perspective(900px)

            rotateX(3deg)
            rotateY(8deg)

            translateY(-10px)
            translateZ(90px);
    }
}


/* =========================================================
   NAME
========================================================= */

.app-name{

    font-size:2.35rem;

    line-height:1;

    font-weight:900;

    letter-spacing:2px;

    background:

    linear-gradient(
        90deg,
        #ffffff,
        #8ebaff,
        #ffffff,
        #a78bfa
    );

    background-size:250% auto;

    -webkit-background-clip:text;

    background-clip:text;

    -webkit-text-fill-color:transparent;

    transform:
        translateZ(40px);

    text-shadow:
        0 10px 25px
        rgba(59,130,246,.35);

    animation:
        textShine
        4s
        linear
        infinite;
}

@keyframes textShine{

    to{
        background-position:
            250% center;
    }

}


/* =========================================================
   BADGES
========================================================= */

.badge{

    display:inline-flex;

    align-items:center;

    gap:5px;

    padding:
        6px 12px;

    border-radius:20px;

    font-size:.72rem;

    font-weight:800;

    background:
        rgba(16,185,129,.13);

    border:
        1px solid
        rgba(16,185,129,.35);

    color:#4ee4b0;

    transform:
        translateZ(25px);
}


/* =========================================================
   FEATURES
========================================================= */

.feature-item{

    display:flex;

    align-items:center;

    gap:14px;

    padding:
        12px 14px;

    border-radius:17px;

    background:

    linear-gradient(
        100deg,
        rgba(255,255,255,.075),
        rgba(255,255,255,.025)
    );

    border:
        1px solid
        rgba(255,255,255,.07);

    transform:
        translateZ(25px);

    box-shadow:

        inset 0 1px
        rgba(255,255,255,.04),

        0 8px 20px
        rgba(0,0,0,.15);
}


/* =========================================================
   DOWNLOAD BUTTON
========================================================= */

.btn-3d-container{

    margin-top:24px;

    transform:
        translateZ(50px);
}

.btn-3d{

    position:relative;

    width:100%;

    min-height:68px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:21px;

    color:white;

    text-decoration:none;

    font-size:1.12rem;

    font-weight:900;

    letter-spacing:1px;

    background:

    linear-gradient(
        180deg,
        #5b9cff 0%,
        #2865e6 50%,
        #1948b9 100%
    );

    border:
        1px solid
        #86baff;

    box-shadow:

        0 9px 0
        #102c6d,

        0 20px 35px
        rgba(37,99,235,.45),

        inset 0 2px 3px
        rgba(255,255,255,.5);

    overflow:hidden;

    transition:.15s;
}

.btn-3d:active{

    transform:
        translateY(8px);

    box-shadow:

        0 2px 0
        #102c6d,

        0 8px 15px
        rgba(37,99,235,.4);
}

.btn-3d::before{

    content:"";

    position:absolute;

    top:-100%;

    left:-50%;

    width:28%;

    height:300%;

    background:
        rgba(255,255,255,.35);

    transform:
        rotate(25deg);

    animation:
        buttonShine
        3.5s
        infinite;
}

@keyframes buttonShine{

    0%{
        left:-50%;
    }

    55%,100%{
        left:140%;
    }
}


/* =========================================================
   FRESH / REFRESH BUTTON
========================================================= */

.refresh-btn{

    margin:
        16px auto 0;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    padding:
        8px 16px;

    border-radius:20px;

    color:#91a7ce;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(130,160,220,.16);

    font-size:10px;

    font-weight:800;

    letter-spacing:1px;

    text-transform:uppercase;

    cursor:pointer;

    transition:.2s;
}

.refresh-btn:active{

    transform:
        scale(.94);

    background:
        rgba(59,130,246,.12);

    color:#b9d1ff;
}

.refresh-btn i{

    font-size:11px;
}


/* =========================================================
   VERIFIED
========================================================= */

.verified{

    margin-top:13px;

    color:#687795;

    font-size:9px;

    font-weight:800;

    letter-spacing:2px;
}

.verified i{

    color:#22c55e;

    margin-right:5px;

    filter:
        drop-shadow(
            0 0 5px
            #22c55e
        );
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-height:720px){

    .card-container{
        transform:scale(.88);
    }

}

@media(max-height:650px){

    .card-container{
        transform:scale(.78);
    }

}

@media(max-width:360px){

    .card-container{
        padding:10px;
    }

    .glass-card{
        padding:
            22px 17px 18px;
    }

    .app-name{
        font-size:2rem;
    }

    .app-logo-3d{
        width:105px;
        height:105px;
    }

}

</style>

</head>

<script>

/* =========================================================
   CREATE PEOPLE
========================================================= */

const crowd =
    document.getElementById("crowd");

for(let i=0;i<30;i++){

    const person =
        document.createElement("div");

    person.className="person";

    const scale =
        0.55 +
        Math.random() * 0.7;

    person.style.transform =
        `scale(${scale})`;

    person.style.animationDelay =
        `${Math.random()*3}s`;

    person.innerHTML = `

        <div class="head"></div>

        <div class="body"></div>

        <div class="arm left"></div>

        <div class="arm right"></div>

        <div class="leg left"></div>

        <div class="leg right"></div>

    `;

    crowd.appendChild(person);
}


/* =========================================================
   3D CARD TILT
========================================================= */

const card =
    document.getElementById("tiltCard");

const container =
    document.querySelector(".card-container");


function setTilt(x,y){

    const rect =
        card.getBoundingClientRect();

    const centerX =
        rect.width / 2;

    const centerY =
        rect.height / 2;

    const rotateX =
        ((y-centerY)/centerY)*-7;

    const rotateY =
        ((x-centerX)/centerX)*7;

    container.style.transform =

        `rotateX(${rotateX}deg)
         rotateY(${rotateY}deg)`;
}


/* MOUSE */

card.addEventListener(
    "mousemove",
    function(e){

        const rect =
            card.getBoundingClientRect();

        setTilt(
            e.clientX - rect.left,
            e.clientY - rect.top
        );

    }
);


card.addEventListener(
    "mouseleave",
    function(){

        container.style.transform =
            "rotateX(0deg) rotateY(0deg)";

    }
);


/* TOUCH */

card.addEventListener(
    "touchmove",
    function(e){

        const touch =
            e.touches[0];

        const rect =
            card.getBoundingClientRect();

        setTilt(
            touch.clientX - rect.left,
            touch.clientY - rect.top
        );

    },
    {
        passive:true
    }
);


card.addEventListener(
    "touchend",
    function(){

        container.style.transform =
            "rotateX(0deg) rotateY(0deg)";

    }
);


/* =========================================================
   FRESH / FORCE REFRESH
========================================================= */

document
.getElementById("refreshBtn")
.addEventListener(
    "click",
    function(){

        const btn = this;

        btn.innerHTML =
            `
            <i class="fa-solid fa-spinner fa-spin"></i>
            Refreshing...
            `;

        /*
           Cache-busting reload.
           URL mein timestamp add hota hai.
        */

        setTimeout(
            function(){

                const url =
                    window.location.href
                    .split("?")[0]
                    +
                    "?fresh="
                    +
                    Date.now();

                window.location.replace(url);

            },
            500
        );

    }
);


/* =========================================================
   PREVENT OLD IMAGE CACHE
========================================================= */

const logo =
    document.querySelector(
        ".logo-face img"
    );

logo.addEventListener(
    "error",
    function(){

        /*
          Agar image temporarily load na ho
          to fresh URL se dobara load.
        */

        this.src =
            "https://i.ibb.co/35fS6sHm/1000571878.png?reload="
            +
            Date.now();

    }
);

</script>
