<style>

  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent

html,body{

body{

/* =========================================================
   ORIGINAL 3D WORLD
   ========================================================= */

#bg{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:-20;
  display:block
}

.vig{
  position:fixed;
  inset:0;
  z-index:-10;
  pointer-events:none;
  background:
    radial-gradient(
      130% 95% at 50% 45%,
      transparent 55%,
      rgba(3,2,1,.75)

      180deg,
      rgba(3,2,1,.35),
      transparent 22%,
      transparent 78%,
      rgba(3,2,1,.45)

}

/* =========================================================
   SOUND BUTTON
   ========================================================= */

#snd{
  position:fixed;
  top:max(14px,env(safe-area-inset-top));
  right:14px;
  z-index:100;
  width:44px;
  height:44px;
  border-radius:50%;
  border:1px solid rgba(245,215,122,.4);
  background:rgba(20,14,6,.65);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:#f5d77a;
  font-size:16px;
  cursor:pointer;
  display:grid;
  place-items:center;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none
}

#snd.hint::after{
  content:"";
  position:absolute;
  inset:-6px;
  border-radius:50%;
  border:2px solid #f5d77a;
  animation:ping 1.6s infinite
}

@keyframes ping{
  from{
    transform:scale(.8);
    opacity:.9
  }
  to{
    transform:scale(1.5);
    opacity:0
  }
}

/* =========================================================
   CARD
   ========================================================= */

.card-container{
  width:100%;
  max-width:395px;
  padding:15px;
  z-index:30;
  transform:
    scale(var(--s,1))
    rotateX(var(--rx,0deg))
    rotateY(var(--ry,0deg))
}

.glass-card{
  position:relative;
  padding:27px 22px 20px;
  border-radius:34px;
  background:
    linear-gradient(
      145deg,
      rgba(30,22,10,.58),
      rgba(8,6,3,.74)

  border:1px solid rgba(245,215,122,.3);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
  box-shadow:
    0 40px 80px rgba(0,0,0,.7),
    0 0 80px rgba(224,179,74,.18),
    inset 0 1px 0 rgba(255,255,255,.16),
    inset 0 -1px 0 rgba(0,0,0,.6)
}

.glass-card::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:36px;
  z-index:-1;
  opacity:.45;
  filter:blur(5px);
  background:
    linear-gradient(
      120deg,
      transparent,
      rgba(224,179,74,.7),
      rgba(255,240,184,.5),
      rgba(180,120,30,.65),
      transparent
    )
}

.glass-card::after{
  content:"";
  position:absolute;
  top:0;
  left:12%;
  right:12%;
  height:2px;
  background:
    linear-gradient(
      90deg,
      transparent,
      #e0b34a,
      #fff0b8,
      #e0b34a,
      transparent
    );

<script>
(function(){

"use strict";


/* =========================================================
   BASIC HELPERS
   ========================================================= */

const $=s=>document.querySelector(s);

let px=0;
let py=0;
let sx=0;
let sy=0;
let world=null;


/* =========================================================
   SMART REFERRAL SYSTEM
   ========================================================= */

const urlParams=new URLSearchParams(
  window.location.search
);

const refCodeRaw=urlParams.get('ref');

const refCode=
  refCodeRaw
  ? refCodeRaw.trim()
  : '';

const dlBtn=$('#downloadBtn');
const refSec=$('#refSection');
const copyBtn=$('#copyRefBtn');
const dispCode=$('#displayRefCode');
const refNotice=$('#refNotice');


/*
  If referral exists:
  - show referral box
  - hide download
  - require copy
*/

if(refCode){

  refSec.style.display='block';

  dispCode.textContent=refCode;

  dlBtn.style.display='none';


  async function copyReferral(){

    let copied=false;


    /*
      Modern clipboard
    */

    if(
      navigator.clipboard &&
      typeof navigator.clipboard.writeText==='function'
    ){

      try{

        await navigator.clipboard.writeText(
          refCode
        );

        copied=true;

      }catch(err){

        console.warn(
          'Clipboard API failed:',
          err
        );

      }

    }


    /*
      Fallback
    */

    if(!copied){

      const textArea=
        document.createElement('textarea');

      textArea.value=refCode;

      textArea.setAttribute(
        'readonly',
        ''
      );

      textArea.style.position='fixed';
      textArea.style.left='-9999px';
      textArea.style.top='0';
      textArea.style.opacity='0';

      document.body.appendChild(
        textArea
      );

      textArea.focus();
      textArea.select();

      try{

        copied=
          document.execCommand('copy');

      }catch(err){

        copied=false;

      }

      document.body.removeChild(
        textArea
      );

    }


    /*
      Unlock only after successful copy
    */

    if(copied){

      copyBtn.innerHTML=
        '<i class="fa-solid fa-check mr-1"></i> Copied!';

      copyBtn.classList.add(
        'copied'
      );

      refNotice.style.color=
        '#4ee4b0';

      refNotice.innerHTML=
        '🎉 Code Copied Successfully! Download Unlocked.';

      dlBtn.style.display='flex';

    }else{

      /*
        Clipboard completely blocked.
        Give user the code instead of falsely
        claiming it was copied.
      */

      refNotice.style.color=
        '#fca5a5';

      refNotice.textContent=
        '⚠️ Copy blocked. Long-press the code and copy it manually.';

      alert(
        'Invite Code:\n'+refCode
      );

    }

  }


  copyBtn.addEventListener(
    'click',
    function(e){

      e.preventDefault();
      e.stopPropagation();

      copyReferral();

    },
    true
  );

}


/* =========================================================
   POINTER / DEVICE ORIENTATION
   ========================================================= */

window.addEventListener(
  'pointermove',
  e=>{

    px=e.clientX/innerWidth-.5;
    py=e.clientY/innerHeight-.5;

  },
  {passive:true}
);


window.addEventListener(
  'deviceorientation',
  e=>{

    if(e.gamma==null)
      return;

    px=Math.max(
      -.5,
      Math.min(
        .5,
        e.gamma/50
      )
    );

    py=Math.max(
      -.5,
      Math.min(
        .5,
        (e.beta-50)/80
      )
    );

  }
);


/* =========================================================
   ORIGINAL LUXURY 3D WORLD
   ========================================================= */

function buildWorld(){

  const low=
    (navigator.hardwareConcurrency||4)<=4;

  const AD=THREE.AdditiveBlending;

  const T=
    Math.tan(
      25*Math.PI/180
    );


  const R=
    new THREE.WebGLRenderer({
      canvas:$('#bg'),
      antialias:!low
    });


  R.setPixelRatio(
    Math.min(
      devicePixelRatio||1,
      low?1:1.5
    )
  );


  const S=new THREE.Scene();

  const cam=
    new THREE.PerspectiveCamera(
      50,
      1,
      1,
      500
    );

  const items=[];


  S.background=
    new THREE.Color(0x050403);

  cam.position.set(
    0,
    4,
    52
  );


  function place(){

    items.forEach(m=>{

      const u=m.userData;

      const hh=
        (52-u.z)*T;

      u.bx=
        u.nx*
        hh*
        cam.aspect*
        .9;

      u.by=
        u.ny*
        hh;

      m.position.set(
        u.bx,
        u.by,
        u.z
      );

    });

  }


  function size(){

    const w=innerWidth;
    const h=innerHeight;

    R.setSize(
      w,
      h,
      false
    );

    cam.aspect=w/h;

    cam.updateProjectionMatrix();

    place();

  }


  S.add(
    new THREE.AmbientLight(
      0x2a2016,
      1
    )
  );


  const l1=
    new THREE.PointLight(
      0xffc766,
      1.7,
      260
    );

  l1.position.set(
    -30,
    30,
    40
  );

  S.add(l1);


  const l2=
    new THREE.PointLight(
      0xfff1d0,
      1.2,
      260
    );

  l2.position.set(
    30,
    12,
    45
  );

  S.add(l2);


  const l3=
    new THREE.PointLight(
      0x7a9cff,
      .5,

/* =========================================================
   SOUND ENGINE v5
   ========================================================= */

const Snd=(()=>{

  let ctx=null;
  let master=null;
  let pad=null;
  let cv=null;
  let dl=null;
  let nb=null;
  let au=null;

  let mode='';
  let started=false;
  let on=false;
  let want=true;

  let ss=false;
  let nt=0;
  let st=0;

  let lastP=0;
  let lastF=76;

  let pumpTimer=null;


  try{

    want=
      localStorage.getItem(
        'kz_snd'
      )!=='0';

  }catch(e){

    want=true;

  }


  const b=$('#snd');

  const MUSIC_URL='bgsong.mp3';

  const f=
    m=>440*
    Math.pow(
      2,
      (m-69)/12
    );

  const SX=
    60/84/4;


  const CH=[
    {
      r:36,
      p:[52,55,59,62,64],
      a:[60,64,67,71,72,76,79]
    },
    {
      r:33,
      p:[52,55,59,60,64],
      a:[57,60,64,67,69,72,76]
    },
    {
      r:41,
      p:[52,57,60,64,67],
      a:[60,64,65,69,72,76,77]
    },
    {
      r:43,
      p:[53,57,59,62,64],
      a:[59,62,65,67,69,71,74]
    }
  ];


  const PEN=[
    72,
    74,
    76,
    79,
    81,
    84
  ];


  /* =======================================================
     SOUND UI
     ======================================================= */

  function ui(){

    b.innerHTML=
      '<i class="fa-solid '+
      (
        on
        ?'fa-volume-high'
        :'fa-volume-xmark'
      )+
      '"></i>';


    b.classList.toggle(
      'hint',
      want&&!started
    );


    b.setAttribute(
      'aria-label',
      on
      ?'Sound band karo'
      :'Sound chalao'
    );


    b.setAttribute(
      'aria-pressed',
      on
      ?'true'
      :'false'
    );

  }


  /* =======================================================
     INITIALIZE WEB AUDIO
     ======================================================= */

  function init(){

    if(ctx)
      return;


    const AC=
      window.AudioContext ||
      window.webkitAudioContext;


    if(!AC){

      console.warn(
        'Web Audio API unavailable'
      );

      return;

    }


    ctx=new AC();


    const comp=
      ctx.createDynamicsCompressor();

    comp.threshold.value=-22;
    comp.ratio.value=3.5;
    comp.attack.value=.01;
    comp.release.value=.3;


    master=
      ctx.createGain();

    master.gain.value=0;

    master.connect(comp);

    comp.connect(
      ctx.destination
    );


    /* Reverb */

    cv=
      ctx.createConvolver();


    const L=
      ctx.sampleRate*3.6;


    const ir=
      ctx.createBuffer(
        2,
        L,
        ctx.sampleRate
      );


    for(let c=0;c<2;c++){

      const d=
        ir.getChannelData(c);


      for(let i=0;i<L;i++){

        d[i]=
          (Math.random()*2-1)*
          Math.pow(
            1-i/L,
            2.4
          );

      }

    }


    cv.buffer=ir;


    const wet=
      ctx.createGain();

    wet.gain.value=.75;

    cv.connect(wet);

    wet.connect(master);


    /* Pad */

    pad=
      ctx.createBiquadFilter();

    pad.type='lowpass';

    pad.frequency.value=1500;

    pad.Q.value=.5;

    pad.connect(master);

    pad.connect(cv);


    /* Delay */

    dl=
      ctx.createDelay(1.5);

    dl.delayTime.value=
      SX*3;


    const fb=
      ctx.createGain();

    fb.gain.value=.38;


    const tn=
      ctx.createBiquadFilter();

    tn.type='lowpass';

    tn.frequency.value=2600;


    dl.connect(tn);

    tn.connect(fb);

    fb.connect(dl);

    tn.connect(master);

    tn.connect(cv);


    /* Noise */

    nb=
      ctx.createBuffer(
        1,
        ctx.sampleRate,
        ctx.sampleRate
      );


    const nd=
      nb.getChannelData(0);


    for(let i=0;i<nd.length;i++){

      nd[i]=
        Math.random()*2-1;

    }


    /* LFO */

    const lfo=
      ctx.createOscillator();

    const lg=
      ctx.createGain();


    lfo.frequency.value=.08;

    lg.gain.value=450;

    lfo.connect(lg);

    lg.connect(
      pad.frequency
    );

    lfo.start();

  }


  /* =======================================================
     TONE
     ======================================================= */

  function tone(
    t,
    fr,
    type,
    pk,
    a,
    d,
    dst
  ){

    const o=
      ctx.createOscillator();

    const g=
      ctx.createGain();


    o.type=type;

    o.frequency.value=fr;


    g.gain.setValueAtTime(
      0,
      t
    );


    g.gain.linearRampToValueAtTime(
      pk,
      t+a
    );


    g.gain.exponentialRampToValueAtTime(
      .0001,
      t+a+d
    );


    o.connect(g);


    dst.forEach(x=>{
      g.connect(x);
    });


    o.start(t);

    o.stop(
      t+a+d+.05
    );

  }


  /* =======================================================
     NOISE
     ======================================================= */

  function nz(
    t,
    type,
    fr,
    pk,
    d,
    dst
  ){

    const s=
      ctx.createBufferSource();

    const fl=
      ctx.createBiquadFilter();

    const g=
      ctx.createGain();


    s.buffer=nb;


    fl.type=type;

    fl.frequency.value=fr;

    fl.Q.value=.9;


    g.gain.setValueAtTime(
      pk,
      t
    );


    g.gain.exponentialRampToValueAtTime(
      .0001,
      t+d
    );


    s.connect(fl);

    fl.connect(g);


    dst.forEach(x=>{
      g.connect(x);
    });


    s.start(
      t,
      Math.random()*.5
    );


    s.stop(
      t+d+.05
    );

  }


  /* =======================================================
     PAD CHORD
     ======================================================= */

  function padChord(t,c){

    const D=6.6;


    c.p.forEach(m=>{

      [
        ['sawtooth',-8,.009],
        ['sine',6,.018]
      ].forEach(v=>{

        const o=
          ctx.createOscillator();

        const g=
          ctx.createGain();


        o.type=v[0];

        o.frequency.value=f(m);

        o.detune.value=v[1];


        g.gain.setValueAtTime(
          0,
          t
        );


        g.gain.linearRampToValueAtTime(
          v[2],
          t+1.3
        );


        g.gain.setValueAtTime(
          v[2],
          t+D-2
        );


        g.gain.linearRampToValueAtTime(
          0,
          t+D
        );


        o.connect(g);

        g.connect(pad);


        o.start(t);

        o.stop(
          t+D+.05
        );

      });

    });

  }


  /* =======================================================
     KICK
     ======================================================= */

  function kick(t){

    const o=
      ctx.createOscillator();

    const g=
      ctx.createGain();


    o.frequency.setValueAtTime(
      140,
      t
    );


    o.frequency.exponentialRampToValueAtTime(
      48,
      t+.16
    );


    g.gain.setValueAtTime(
      .4,
      t
    );


    g.gain.exponentialRampToValueAtTime(
      .0001,
      t+.34
    );


    o.connect(g);

    g.connect(master);


    o.start(t);

    o.stop(
      t+.36
    );

  }


  /* =======================================================
     BASS
     ======================================================= */

  function bass(t,m,d){

    tone(
      t,
      f(m),
      'sine',
      .26,
      .012,
      d,
      [master]
    );


    tone(
      t,
      f(m+12),
      'triangle',
      .07,
      .012,
      d*.7,
      [master]
    );

  }


  /* =======================================================
     PLUCK
     ======================================================= */

  function pluck(t,m){

    tone(
      t,
      f(m),
      'triangle',
      .075,
      .004,
      1,
      [master,cv,dl]
    );


    tone(
      t,
      f(m+12),
      'sine',
      .025,
      .004,
      .5,
      [cv,dl]
    );

  }


  /* =======================================================
     FLUTE
     ======================================================= */

  function flute(t,m,len){

    const o=
      ctx.createOscillator();

    const o2=
      ctx.createOscillator();

    const g=
      ctx.createGain();

    const g2=
      ctx.createGain();

    const lf=
      ctx.createOscillator();

    const lg=
      ctx.createGain();


    o.type='sine';

    o2.type='triangle';


    [o,o2].forEach(x=>{

      x.frequency.setValueAtTime(
        f(m-2),
        t
      );


      x.frequency.exponentialRampToValueAtTime(
        f(m),
        t+.09
      );

    });


    lf.frequency.value=5.2;

    lg.gain.value=7;


    lf.connect(lg);

    lg.connect(o.detune);

    lg.connect(o2.detune);


    g2.gain.value=.3;


    o2.connect(g2);

    g2.connect(g);

    o.connect(g);


    g.gain.setValueAtTime(
      0,
      t
    );


    g.gain.linearRampToValueAtTime(
      .06,
      t+.12
    );


    g.gain.setValueAtTime(
      .06,
      t+len-.25
    );


    g.gain.linearRampToValueAtTime(
      0,
      t+len
    );


    g.connect(master);

    g.connect(cv);

    g.connect(dl);


    [o,o2,lf].forEach(x=>{

      x.start(t);

      x.stop(
        t+len+.05
      );

    });

  }


  /* =======================================================
     MUSIC STEP
     ======================================================= */

  function step(s,t){

    const bar=s%16;

    const c=
      CH[(s>>5)%4];


    if(s%32===0)
      padChord(t,c);


    if(bar===0)
      bass(t,c.r,2.2);


    if(bar===10)
      bass(t,c.r+7,1.2);


    if(bar%8===0)
      kick(t);


    if(
      bar===4||
      bar===12
    ){

      nz(
        t,
        'bandpass',
        1900,
        .09,
        .12,
        [master,cv]
      );

    }


    if(bar%2===0){

      nz(
        t+
        (bar%4===2?.02:0),

        'highpass',

        7500,

        bar===14?.05:.03,

        bar===14?.18:.05,

        [master]
      );

    }


    if(
      [0,3,6,8,10,12,14]
      .indexOf(bar)>-1
      &&
      Math.random()<.78
    ){

      let m;

      do{

        m=
          c.a[
            Math.random()*
            c.a.length|
            0
          ];

      }while(m===lastP);


      lastP=m;

      pluck(
        t,
        m
      );

    }


    if(
      (bar===2||bar===8)
      &&
      Math.random()<.7
    ){

      let i=
        PEN.indexOf(lastF)
        +
        (Math.random()*3|0)
        -1;


      i=Math.max(
        0,
        Math.min(
          PEN.length-1,
          i
        )
      );


      lastF=PEN[i];


      flute(
        t,
        lastF,
        SX*
        (bar===2?6:8)
      );

    }


    if(
      s%32===16
      &&
      Math.random()<.5
    ){

      tone(
        t,
        f(
          c.a[
            c.a.length-1
          ]+12
        ),
        'sine',
        .035,
        .01,
        2.6,
        [cv,master]
      );

    }

  }


  /* =======================================================
     PUMP
     ======================================================= */

  function pump(){

    if(
      !on||
      !ctx||
      ctx.state!=='running'
    )
      return;


    while(
      nt<
      ctx.currentTime+.18
    ){

      step(
        st,
        nt
      );

      nt+=SX;

      st++;

    }

  }


  /* =======================================================
     START SYNTH
     ======================================================= */

  async function startSynth(){

    try{

      init();


      if(!ctx)
        return false;


      if(
        ctx.state==='suspended'
      ){

        await ctx.resume();

      }


      if(
        ctx.state!=='running'
      ){

        return false;

      }


      on=true;

      started=true;

      mode='synth';


      master.gain.cancelScheduledValues(
        ctx.currentTime
      );


      master.gain.setTargetAtTime(
        .9,
        ctx.currentTime,
        .15
      );


      if(!ss){

        ss=true;

        nt=
          ctx.currentTime+.05;


        pumpTimer=
          setInterval(
            pump,
            40
          );

      }else{

        nt=
          Math.max(
            nt,
            ctx.currentTime+.05
          );

      }


      ui();


      return true;

    }catch(err){

      console.warn(
        'KamZilla synth start failed:',
        err
      );

      return false;

    }

  }


  /* =======================================================
     MP3 FADE
     ======================================================= */

  function fade(to){

    if(!au)
      return;


    clearInterval(
      fade.i
    );


    fade.i=
      setInterval(()=>{

        const d=
          to-au.volume;


        if(
          Math.abs(d)<.03
        ){

          au.volume=to;

          clearInterval(
            fade.i
          );


          if(!to)
            au.pause();


        }else{

          au.volume=
            Math.max(
              0,
              Math.min(
                1,
                au.volume+
                d*.15
              )
            );

        }

      },60);

  }


  /* =======================================================
     START MP3
     ======================================================= */

  async function startMusic(){

    if(!au){

      au=
        new Audio();

      au.src=
        MUSIC_URL;

      au.loop=true;

      au.preload='auto';

      au.volume=0;

    }


    mode='file';


    try{

      await au.play();


      on=true;

      started=true;


      fade(.5);


      ui();


      return true;


    }catch(err){

      console.warn(
        'MP3 could not start, using synth:',
        err
      );


      /*
        Critical fallback:
        synth starts immediately from
        the same button gesture.
      */

      return await startSynth();

    }

  }


  /* =======================================================
     PLAY
     ======================================================= */

  async function play(){

    want=true;


    /*
      Existing synth:
      simply resume it.
    */

    if(
      mode==='synth'&&
      ctx
    ){

      try{

        if(
          ctx.state==='suspended'
        ){

          await ctx.resume();

        }


        if(
          ctx.state!=='running'
        ){

          return;

        }


        on=true;

        started=true;


        master.gain.cancelScheduledValues(
          ctx.currentTime
        );


        master.gain.setTargetAtTime(
          .9,
          ctx.currentTime,
          .15
        );


        ui();

        save();

        return;

      }catch(e){

        console.warn(
          'Existing synth resume failed:',
          e
        );

      }

    }


    /*
      First attempt MP3.
      If it fails, start synth.
    */

    const ok=
      await startMusic();


    if(!ok){

      await startSynth();

    }


    save();

    ui();

  }


  /* =======================================================
     MUTE
     ======================================================= */

  function mute(){

    on=false;


    if(
      mode==='file'&&
      au
    ){

      fade(0);

    }else if(
      mode==='synth'&&
      ctx&&
      master
    ){

      master.gain.setTargetAtTime(
        0,
        ctx.currentTime,
        .2
      );

    }


    save();

    ui();

  }


  /* =======================================================
     SAVE SOUND SETTING
     ======================================================= */

  function save(){

    try{

      localStorage.setItem(
        'kz_snd',
        on?'1':'0'
      );

    }catch(e){}

  }


  /* =======================================================
     DIRECT SOUND BUTTON
     
     IMPORTANT:
     This handler is attached directly to #snd.
     Referral URL cannot block it.
     ======================================================= */

  b.addEventListener(
    'click',
    async function(e){

      e.preventDefault();

      e.stopPropagation();


      if(!on){

        await play();

      }else{

        mute();

      }

    },
    true
  );


  /*
    Other page interaction can also unlock
    sound if the user has not disabled it.
  */

  function unlock(e){

    if(
      e.target&&
      e.target.closest&&
      e.target.closest('#snd')
    ){

      return;

    }


    if(
      started||
      on||
      !want
    ){

      return;

    }


    play();

  }


  [
    'pointerup',
    'touchend',
    'click',
    'keydown'
  ].forEach(ev=>{

    window.addEventListener(
      ev,
      unlock,
      {
        passive:true
      }
    );

  });


  ui();

})();


/* =========================================================
   URL-SAFE REFRESH
   ========================================================= */

$('#refreshBtn').addEventListener(
  'click',
  function(){

    this.innerHTML=
      '<i class="fa-solid fa-spinner fa-spin"></i> Refreshing...';


    /*
      IMPORTANT:
      location.reload() reloads the SAME URL.
      Therefore:
      ?ref=CODE remains intact.
    */

    setTimeout(
      ()=>{
        location.reload();
      },
      400
    );

  }
);


/* =========================================================
   LOGO ERROR FALLBACK
   ========================================================= */

$('.logo-face img').addEventListener(
  'error',
  function(){

    this.src=
      'https://i.ibb.co/35fS6sHm/1000571878.png?reload='+
      Date.now();

  }
);

})();
</script>
