<script>
(function(){
const $=s=>document.querySelector(s);
let px=0,py=0,sx=0,sy=0,world=null;

/* ==== MUSIC: apna song repo mein is naam se upload karo (index.html ke saath) ==== */
const MUSIC_URL='bgsong.mp3';

addEventListener('pointermove',e=>{px=e.clientX/innerWidth-.5;py=e.clientY/innerHeight-.5},{passive:true});
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;
px=Math.max(-.5,Math.min(.5,e.gamma/50));py=Math.max(-.5,Math.min(.5,(e.beta-50)/80))});

/* =====================  3D GLOBAL NETWORK  ===================== */
function buildWorld(){
  const low=(navigator.hardwareConcurrency||4)<=4,AD=THREE.AdditiveBlending;
  const R=new THREE.WebGLRenderer({canvas:$('#bg'),antialias:!low});
  R.setPixelRatio(Math.min(devicePixelRatio||1,low?1:1.5));
  const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,1,700);
  S.background=new THREE.Color(0x040816);
  function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();cam.position.set(0,0,25/Math.tan(25*Math.PI/180))}
  size();addEventListener('resize',size);

  const GR=20,G=new THREE.Group();S.add(G);
  const ll=(la,lo,r)=>{const p=(90-la)*Math.PI/180,t=(lo+180)*Math.PI/180;return new THREE.Vector3(-r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t))};
  const geo=a=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));return g};
  const CT=[['Karachi',24.86,67.01],['Hyderabad',25.39,68.37],['Sukkur',27.7,68.86],['Lahore',31.55,74.34],['Islamabad',33.68,73.05],['Peshawar',34.01,71.58],['Multan',30.16,71.52],['Quetta',30.18,66.99],
    ['Dubai',25.2,55.27],['Riyadh',24.71,46.68],['Doha',25.29,51.53],['Istanbul',41.01,28.98],['London',51.51,-.13],['Singapore',1.35,103.82]];
  const U=CT.map(c=>ll(c[1],c[2],1));

  /* globe core + dotted surface (Pakistan glows gold) */
  G.add(new THREE.Mesh(new THREE.SphereGeometry(GR*.995,48,32),new THREE.MeshBasicMaterial({color:0x040a22})));
  const N=low?2800:4600,pp=new Float32Array(N*3),cc=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const y=1-2*(i+.5)/N,rr=Math.sqrt(1-y*y),th=i*2.399963,x=Math.cos(th)*rr,z=Math.sin(th)*rr;
    pp[i*3]=x*GR;pp[i*3+1]=y*GR;pp[i*3+2]=z*GR;
    let k=0;for(let j=0;j<8;j++){const d=x*U[j].x+y*U[j].y+z*U[j].z;k=Math.max(k,Math.min(1,Math.max(0,(d-.972)/.025)))}
    const b=.35+Math.random()*.5;
    cc[i*3]=.12*b*(1-k)+k;cc[i*3+1]=.34*b*(1-k)+.82*k;cc[i*3+2]=.9*b*(1-k)+.4*k;
  }
  const dg=geo(pp);dg.setAttribute('color',new THREE.BufferAttribute(cc,3));
  G.add(new THREE.Points(dg,new THREE.PointsMaterial({size:.36,vertexColors:true,transparent:true,blending:AD,depthWrite:false})));

  /* graticule */
  const gl=[],sg=(a,b)=>gl.push(a.x,a.y,a.z,b.x,b.y,b.z);
  for(let la=-60;la<=60;la+=30)for(let lo=-180;lo<180;lo+=6)sg(ll(la,lo,GR*1.002),ll(la,lo+6,GR*1.002));
  for(let lo=-180;lo<180;lo+=30)for(let la=-84;la<84;la+=6)sg(ll(la,lo,GR*1.002),ll(la+6,lo,GR*1.002));
  G.add(new THREE.LineSegments(geo(gl),new THREE.LineBasicMaterial({color:0x2563eb,transparent:true,opacity:.25,blending:AD})));

  /* atmosphere glow */
  const at=new THREE.Mesh(new THREE.SphereGeometry(GR*1.2,48,32),new THREE.ShaderMaterial({side:THREE.BackSide,transparent:true,blending:AD,depthWrite:false,
    vertexShader:'varying vec3 n;void main(){n=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'varying vec3 n;void main(){float i=pow(max(.68-dot(n,vec3(0.,0.,1.)),0.),3.);gl_FragColor=vec4(.25,.55,1.,1.)*i*2.2;}'}));
  S.add(at);

  /* city markers, pulse rings, labels */
  const mk=[];CT.forEach(c=>{const v=ll(c[1],c[2],GR*1.006);mk.push(v.x,v.y,v.z)});
  G.add(new THREE.Points(geo(mk),new THREE.PointsMaterial({size:1.5,color:0xfde68a,transparent:true,blending:AD,depthWrite:false})));
  const rings=[],Z=new THREE.Vector3(0,0,1);
  CT.forEach((c,i)=>{
    const v=ll(c[1],c[2],GR*1.007),m=new THREE.Mesh(new THREE.RingGeometry(.5,.62,32),new THREE.MeshBasicMaterial({color:i<8?0xfde68a:0x67e8f9,transparent:true,blending:AD,side:THREE.DoubleSide,depthWrite:false}));
    m.position.copy(v);m.quaternion.setFromUnitVectors(Z,v.clone().normalize());G.add(m);rings.push(m);
  });
  function label(t){
    const k=document.createElement('canvas');k.width=256;k.height=64;const q=k.getContext('2d');
    q.font='700 28px Outfit,sans-serif';q.textAlign='center';q.fillStyle='#fff6d6';q.shadowColor='#f5d77a';q.shadowBlur=12;q.fillText(t.toUpperCase(),128,40);
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k),transparent:true,depthWrite:false}));s.scale.set(7.5,1.9,1);return s;
  }
  [0,3,4,8,12,13].forEach(i=>{const l=label(CT[i][0]);l.position.copy(ll(CT[i][1],CT[i][2],GR*1.1));G.add(l)});

  /* great-circle arcs + travelling packets */
  const AR=[[0,8],[3,9],[4,12],[0,13],[3,11],[1,10],[4,8],[0,3],[0,4],[7,2],[6,3],[5,4],[2,6]],arcs=[];
  AR.forEach(p=>{
    const a=U[p[0]],b=U[p[1]],om=Math.acos(Math.min(1,a.dot(b))),so=Math.sin(om),pts=[];
    for(let s=0;s<=48;s++){const t=s/48;
      pts.push(a.clone().multiplyScalar(Math.sin((1-t)*om)/so).add(b.clone().multiplyScalar(Math.sin(t*om)/so)).multiplyScalar(GR*(1.006+Math.sin(Math.PI*t)*(.04+.2*om/Math.PI))))}
    arcs.push(pts);
    G.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:p[0]<8&&p[1]<8?0xfde68a:0x38bdf8,transparent:true,opacity:.6,blending:AD})));
  });
  const PN=arcs.length*2,pk=new Float32Array(PN*3),ph=[];for(let i=0;i<PN;i++)ph.push(Math.random());
  const pg=geo(pk);G.add(new THREE.Points(pg,new THREE.PointsMaterial({size:1.7,color:0xffffff,transparent:true,blending:AD,depthWrite:false})));

  /* orbit rings + satellites */
  function orbit(rad,col,tx,tz,sp){
    const t=new THREE.Group();t.rotation.set(tx,0,tz);const p=new THREE.Group();t.add(p);
    p.add(new THREE.Mesh(new THREE.TorusGeometry(rad,.05,8,140),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.6,blending:AD})));
    const s=new THREE.Mesh(new THREE.SphereGeometry(.55,12,12),new THREE.MeshBasicMaterial({color:col}));s.position.x=rad;p.add(s);
    S.add(t);return()=>{p.rotation.z+=sp};
  }
  const orbs=[orbit(25.5,0xf5d77a,1.25,.25,.006),orbit(29,0x38bdf8,.4,-.7,-.004)];

  /* floating wire crystals */
  const SH=[];
  for(let i=0;i<16;i++){
    const m=new THREE.Mesh(new THREE.OctahedronGeometry(.5+Math.random()*.9),new THREE.MeshBasicMaterial({color:i%3?0x38bdf8:0xf5d77a,wireframe:true,transparent:true,opacity:.6}));
    do{m.position.set((Math.random()-.5)*32,(Math.random()-.5)*46,-6+Math.random()*30)}while(m.position.length()<25);
    m.userData={s:.004+Math.random()*.012,p:Math.random()*6};SH.push(m);S.add(m);
  }
  /* stars */
  const st=[];for(let i=0;i<700;i++){const a=Math.random()*6.283,b=Math.acos(2*Math.random()-1),r=140+Math.random()*200;st.push(r*Math.sin(b)*Math.cos(a),r*Math.sin(b)*Math.sin(a),r*Math.cos(b)-60)}
  S.add(new THREE.Points(geo(st),new THREE.PointsMaterial({size:1.6,sizeAttenuation:false,color:0xbfd4ff,transparent:true,opacity:.8})));

  /* Pakistan faces the camera */
  const c0=ll(30,70,1),baseY=Math.atan2(-c0.x,c0.z),baseX=Math.atan2(c0.y,Math.hypot(c0.x,c0.z));

  return function(ms){
    const t=ms/1000;
    G.rotation.y=baseY+Math.sin(t*.09)*.85+sx*.35;
    G.rotation.x=baseX+sy*.25;
    G.position.y=Math.sin(t*.4)*.5;
    for(let i=0;i<PN;i++){
      ph[i]=(ph[i]+.0028)%1;const a=arcs[i>>1],f=ph[i]*48,k=f|0,w=f-k,A=a[k],B=a[Math.min(k+1,48)];
      pk[i*3]=A.x+(B.x-A.x)*w;pk[i*3+1]=A.y+(B.y-A.y)*w;pk[i*3+2]=A.z+(B.z-A.z)*w;
    }
    pg.attributes.position.needsUpdate=true;
    rings.forEach((m,i)=>{const p=(t*.45+i*.31)%1;m.scale.setScalar(1+p*2.6);m.material.opacity=.8*(1-p)});
    orbs.forEach(f=>f());
    SH.forEach(m=>{m.rotation.x+=m.userData.s;m.rotation.y+=m.userData.s*1.3;m.position.y+=Math.sin(t+m.userData.p)*.01});
    R.render(S,cam);
  };
}
try{world=buildWorld()}catch(err){console.warn('3D background off',err)}

/* main loop: card tilt + 3D scene */
const box=$('#box');
(function loop(t){
  sx+=(px-sx)*.06;sy+=(py-sy)*.06;
  box.style.setProperty('--rx',(-sy*12).toFixed(2)+'deg');
  box.style.setProperty('--ry',(sx*14).toFixed(2)+'deg');
  if(world)world(t);
  requestAnimationFrame(loop);
})(0);

/* =====================  SOUND  =====================
   1) bgsong.mp3 (agar repo mein hai) 2) warna built-in luxury ambient music */
const Snd=(()=>{
  let ctx,master,lp,cv,au=null,mode='',started=false,on=false,want=true,ss=false,n=0;
  try{want=localStorage.getItem('kz_snd')!=='0'}catch(e){}
  const b=$('#snd'),f=m=>440*Math.pow(2,(m-69)/12);
  const CH=[[48,55,59,62,64],[45,52,55,60,64],[41,48,52,57,60],[43,50,57,59,64]],BELL=[72,74,76,79,81,84];
  function ui(){
    b.innerHTML='<i class="fa-solid '+(on?'fa-volume-high':'fa-volume-xmark')+'"></i>';
    b.classList.toggle('hint',want&&!started);
    b.setAttribute('aria-label',on?'Sound band karo':'Sound chalao');
  }
  /* ---- built-in ambient ---- */
  function init(){
    ctx=new(window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
    lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;lp.Q.value=.4;
    const dry=ctx.createGain();dry.gain.value=.55;
    cv=ctx.createConvolver();const L=ctx.sampleRate*4,ir=ctx.createBuffer(2,L,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,2.6)}
    cv.buffer=ir;const wet=ctx.createGain();wet.gain.value=.9;
    lp.connect(dry);dry.connect(master);lp.connect(cv);cv.connect(wet);wet.connect(master);
    const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.07;lg.gain.value=350;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
  }
  function chord(){
    const t=ctx.currentTime;
    CH[n++%4].forEach(m=>[-7,7].forEach((d,j)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type=j?'triangle':'sine';o.frequency.value=f(m);o.detune.value=d;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.03,t+3.5);g.gain.linearRampToValueAtTime(0,t+11);
      o.connect(g);g.connect(lp);o.start(t);o.stop(t+11.2);
    }));
  }
  function bell(){
    const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.value=f(BELL[Math.random()*BELL.length|0]);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.04,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);
    o.connect(g);g.connect(cv);g.connect(master);o.start(t);o.stop(t+3.3);
  }
  function nextBell(){if(on&&mode==='synth')bell();setTimeout(nextBell,2500+Math.random()*3500)}
  function synth(){
    mode='synth';if(!ctx)init();
    ctx.resume();master.gain.setTargetAtTime(.8,ctx.currentTime,.8);
    if(!ss){ss=true;chord();setInterval(()=>{if(on&&mode==='synth')chord()},8000);nextBell()}
    started=true;ui();
  }
  /* ---- song file ---- */
  function fade(to){
    clearInterval(fade.i);
    fade.i=setInterval(()=>{const d=to-au.volume;
      if(Math.abs(d)<.03){au.volume=to;clearInterval(fade.i);if(!to)au.pause()}
      else au.volume=Math.max(0,Math.min(1,au.volume+d*.15))},60);
  }
  function toSynth(){if(mode!=='synth'&&on)synth()}
  function play(){
    on=true;ui();
    if(mode==='synth')return synth();
    if(!au){au=new Audio(MUSIC_URL);au.loop=true;au.preload='auto';au.volume=0;au.addEventListener('error',toSynth)}
    mode='file';
    au.play().then(()=>{started=true;fade(.5);ui()}).catch(e=>{
      if(e&&e.name==='NotAllowedError'){on=false;ui()}else toSynth();
    });
  }
  function mute(){
    on=false;
    if(mode==='file'&&au)fade(0);
    else if(ctx){master.gain.setTargetAtTime(0,ctx.currentTime,.3);setTimeout(()=>{if(!on)ctx.suspend()},1400)}
    ui();
  }
  function save(){try{localStorage.setItem('kz_snd',on?'1':'0')}catch(e){}}
  function unlock(e){
    if(started||on||!want)return;
    if(e.target&&e.target.closest&&e.target.closest('#snd'))return;
    play();
  }
  ['pointerup','touchend','click','keydown'].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
  b.addEventListener('click',()=>{if(!on){want=true;play()}else{want=false;mute()}save()});
  document.addEventListener('visibilitychange',()=>{
    if(!started)return;
    if(document.hidden){if(au&&mode==='file')au.pause();if(ctx)ctx.suspend()}
    else if(on){if(au&&mode==='file')au.play().catch(()=>{});if(ctx&&mode==='synth')ctx.resume()}
  });
  ui();
})();

  this.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Refreshing...';
  setTimeout(()=>{location.replace(location.href.split('?')[0]+'?fresh='+Date.now())},500);
});
$('.logo-face img').addEventListener('error',function(){
  this.src='https://i.ibb.co/35fS6sHm/1000571878.png?reload='+Date.now();
});
})();
