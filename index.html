<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>KamZilla APK</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    font-family:'Outfit',sans-serif;
    color:#fff;
    background:#020611;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:1600px;
}


/* =========================================================
   3D WORLD
========================================================= */

.world{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-20;

    background:
        radial-gradient(
            circle at 50% 12%,
            rgba(46,111,255,.32),
            transparent 32%
        ),
        radial-gradient(
            circle at 10% 70%,
            rgba(0,210,170,.10),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 60%,
            rgba(130,70,255,.12),
            transparent 28%
        ),
        linear-gradient(
            180deg,
            #020612 0%,
            #06112c 48%,
            #061a30 100%
        );
}


/* =========================================================
   ATMOSPHERIC GLOW
========================================================= */

.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:.5;
    pointer-events:none;
}

.glow.one{
    width:260px;
    height:260px;
    left:-100px;
    top:25%;
    background:#1266ff;
}

.glow.two{
    width:240px;
    height:240px;
    right:-100px;
    top:45%;
    background:#8b5cf6;
}

.glow.three{
    width:180px;
    height:180px;
    left:40%;
    bottom:5%;
    background:#00c896;
}


/* =========================================================
   STARS
========================================================= */

.stars{
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(circle at 8% 12%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 18% 30%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 29% 10%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 40% 22%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 52% 8%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 65% 18%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 77% 9%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 88% 27%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 95% 12%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 12% 48%,#fff 0 1px,transparent 2px),
        radial-gradient(circle at 82% 45%,#fff 0 1px,transparent 2px);

    opacity:.55;

    animation:twinkle 4s infinite ease-in-out;
}

@keyframes twinkle{

    0%,100%{
        opacity:.35;
    }

    50%{
        opacity:.8;
    }

}


/* =========================================================
   CITY
========================================================= */

.city{
    position:absolute;
    left:-10%;
    bottom:0;

    width:120%;
    height:34%;

    display:flex;
    align-items:flex-end;
    justify-content:center;

    gap:4px;

    transform:
        perspective(900px)
        rotateX(4deg);

    opacity:.9;
}

.building{
    position:relative;

    width:28px;

    background:
        linear-gradient(
            90deg,
            #030916,
            #10244b,
            #040a18
        );

    border:
        1px solid
        rgba(77,139,255,.18);

    border-radius:4px 4px 0 0;

    box-shadow:
        inset 0 0 18px rgba(43,111,255,.10),
        0 -5px 20px rgba(39,104,255,.10);
}

.building::before{

    content:"";

    position:absolute;

    left:5px;
    right:5px;
    top:10px;
    bottom:10px;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(84,159,255,.45) 0px,
            rgba(84,159,255,.45) 2px,
            transparent 2px,
            transparent 10px
        );

    opacity:.65;
}

.building::after{

    content:"";

    position:absolute;

    top:0;
    left:50%;

    width:2px;
    height:12px;

    transform:translateX(-50%);

    background:#3b82f6;

    box-shadow:
        0 0 8px #3b82f6;
}

.b1{height:90px}
.b2{height:145px}
.b3{height:110px}
.b4{height:185px}
.b5{height:125px}
.b6{height:220px}
.b7{height:160px}
.b8{height:100px}
.b9{height:200px}
.b10{height:135px}
.b11{height:175px}
.b12{height:115px}
.b13{height:235px}
.b14{height:150px}
.b15{height:190px}
.b16{height:120px}


/* =========================================================
   CITY LIGHTS
========================================================= */

.cityLight{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#60a5fa;

    box-shadow:
        0 0 8px #60a5fa;

    animation:
        cityBlink 2s infinite alternate;
}

@keyframes cityBlink{

    from{
        opacity:.25;
    }

    to{
        opacity:1;
    }

}


/* =========================================================
   PEOPLE / CROWD
========================================================= */

.crowd{
    position:absolute;

    left:0;
    right:0;
    bottom:19%;

    height:145px;

    display:flex;
    justify-content:center;
    align-items:flex-end;

    gap:3px;

    transform:
        perspective(700px)
        rotateX(4deg);

    z-index:3;

    opacity:.82;
}

.person{
    position:relative;

    width:22px;
    height:95px;

    animation:
        personMove 3s
        ease-in-out
        infinite;
}

.person:nth-child(2n){
    animation-delay:.6s;
}

.person:nth-child(3n){
    animation-delay:1.1s;
}

.head{
    position:absolute;

    top:0;
    left:50%;

    width:16px;
    height:16px;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #6683b5,
            #17284d
        );
}

.body{
    position:absolute;

    top:17px;
    left:50%;

    width:25px;
    height:52px;

    transform:translateX(-50%);

    border-radius:
        12px
        12px
        5px
        5px;

    background:
        linear-gradient(
            90deg,
            #050b19,
            #17366d,
            #050b19
        );

    box-shadow:
        0 0 10px rgba(45,115,255,.12);
}

.arm{
    position:absolute;

    top:24px;

    width:6px;
    height:42px;

    border-radius:5px;

    background:#102347;
}

.arm.left{
    left:0;
    transform:rotate(18deg);
}

.arm.right{
    right:0;
    transform:rotate(-18deg);
}

.leg{
    position:absolute;

    top:66px;

    width:7px;
    height:30px;

    border-radius:4px;

    background:#050c1d;
}

.leg.left{
    left:5px;
}

.leg.right{
    right:5px;
}

@keyframes personMove{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }

}


/* =========================================================
   FLOATING PARTICLES
========================================================= */

.particle{
    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#3b82f6;

    box-shadow:
        0 0 12px #3b82f6;

    animation:
        particleMove 6s
        linear infinite;
}

.particle.green{
    background:#10b981;
    box-shadow:0 0 12px #10b981;
}

.particle.purple{
    background:#a855f7;
    box-shadow:0 0 12px #a855f7;
}

@keyframes particleMove{

    0%{
        transform:
            translateY(120px)
            scale(.4);

        opacity:0;
    }

    25%{
        opacity:1;
    }

    75%{
        opacity:.7;
    }

    100%{
        transform:
            translateY(-400px)
            scale(1.2);

        opacity:0;
    }

}


/* =========================================================
   FIREWORKS
========================================================= */

.firework{
    position:absolute;

    width:6px;
    height:6px;

    border-radius:50%;

    animation:
        firework 2.8s
        infinite;
}

.fw1{
    left:13%;
    top:17%;

    background:#3b82f6;

    box-shadow:
        0 0 15px #3b82f6,
        0 0 35px #3b82f6;
}

.fw2{
    right:14%;
    top:23%;

    background:#22c55e;

    box-shadow:
        0 0 15px #22c55e,
        0 0 35px #22c55e;

    animation-delay:.8s;
}

.fw3{
    left:50%;
    top:8%;

    background:#a855f7;

    box-shadow:
        0 0 15px #a855f7,
        0 0 35px #a855f7;

    animation-delay:1.4s;
}

.fw4{
    right:35%;
    top:30%;

    background:#facc15;

    box-shadow:
        0 0 15px #facc15,
        0 0 35px #facc15;

    animation-delay:2s;
}

@keyframes firework{

    0%,100%{
        transform:scale(.2);
        opacity:.2;
    }

    35%{
        transform:scale(1);
        opacity:1;
    }

    65%{
        transform:scale(3);
        opacity:.5;
    }

}


/* =========================================================
   MAIN 3D CONTAINER
========================================================= */

.card-container{

    width:100%;
    max-width:390px;

    padding:16px;

    transform-style:preserve-3d;

    transition:
        transform .15s ease;

    z-index:20;
}


/* =========================================================
   GLASS CARD
========================================================= */

.glass-card{

    position:relative;

    padding:
        27px
        22px
        23px;

    border-radius:34px;

    background:
        linear-gradient(
            145deg,
            rgba(18,33,73,.91),
            rgba(4,10,27,.95)
        );

    border:
        1px solid
        rgba(116,159,255,.25);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    transform-style:preserve-3d;

    box-shadow:

        0 35px 80px
        rgba(0,0,0,.8),

        0 0 70px
        rgba(37,99,235,.18),

        inset 0 1px 0
        rgba(255,255,255,.14),

        inset 0 -1px 0
        rgba(0,0,0,.5);
}


/* card border glow */

.glass-card::before{

    content:"";

    position:absolute;

    inset:-2px;

    border-radius:36px;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(59,130,246,.75),
            rgba(139,92,246,.65),
            transparent
        );

    opacity:.35;

    filter:blur(5px);

    z-index:-1;
}


/* top light */

.glass-card::after{

    content:"";

    position:absolute;

    left:13%;
    right:13%;
    top:0;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #3b82f6,
            #a855f7,
            transparent
        );

    box-shadow:
        0 0 15px #3b82f6;
}


/* =========================================================
   3D APP SCREEN
========================================================= */

.app-icon-wrapper{

    position:relative;

    width:105px;
    height:125px;

    margin:
        0 auto
        22px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #1d4ed8,
            #06132f
        );

    border:
        2px solid
        rgba(96,165,250,.8);

    transform-style:preserve-3d;

    transform:
        translateZ(85px)
        rotateX(7deg)
        rotateY(-8deg);

    animation:
        appFloat 4s
        ease-in-out
        infinite;

    box-shadow:

        0 17px 0
        #061333,

        0 30px 45px
        rgba(0,0,0,.75),

        0 0 35px
        rgba(37,99,235,.6),

        inset 0 2px 4px
        rgba(255,255,255,.45);
}


/* image frame */

.app-icon-wrapper img{

    position:absolute;

    left:5px;
    top:5px;

    width:
        calc(100% - 10px);

    height:
        calc(100% - 10px);

    object-fit:contain;

    object-position:center;

    background:#050d20;

    border-radius:17px;

    display:block;

    transform:
        translateZ(18px);

    box-shadow:
        inset 0 0 18px
        rgba(0,0,0,.65);

    z-index:2;
}


/* glass shine */

.app-icon-wrapper .shine{

    position:absolute;

    inset:0;

    border-radius:20px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.27),
            transparent 30%,
            transparent 72%,
            rgba(255,255,255,.07)
        );

    transform:
        translateZ(28px);

    z-index:5;

    pointer-events:none;
}


/* 3D bottom thickness */

.app-icon-wrapper::after{

    content:"";

    position:absolute;

    left:7px;
    right:-8px;
    bottom:-10px;

    height:100%;

    border-radius:21px;

    background:
        linear-gradient(
            145deg,
            #2563eb,
            #061333
        );

    border:
        1px solid
        rgba(96,165,250,.35);

    transform:
        translateZ(-15px)
        translateY(5px);

    z-index:-1;
}


/* floating */

@keyframes appFloat{

    0%,100%{

        transform:
            translateZ(85px)
            translateY(0)
            rotateX(7deg)
            rotateY(-8deg);

    }

    50%{

        transform:
            translateZ(110px)
            translateY(-10px)
            rotateX(3deg)
            rotateY(8deg);

    }

}


/* =========================================================
   APP NAME
========================================================= */

.app-name{

    font-size:2.35rem;

    line-height:1;

    font-weight:900;

    letter-spacing:2px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #8ebaff,
            #ffffff,
            #9d8cff
        );

    background-size:250% auto;

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;

    text-shadow:
        0 10px 25px
        rgba(59,130,246,.35);

    transform:
        translateZ(45px);

    animation:
        nameShine 4s
        linear infinite;
}

@keyframes nameShine{

    to{
        background-position:
            250% center;
    }

}


/* =========================================================
   BADGES
========================================================= */

.badge{

    display:inline-flex;

    align-items:center;

    gap:5px;

    padding:
        6px 12px;

    border-radius:20px;

    font-size:.72rem;

    font-weight:800;

    background:
        rgba(16,185,129,.13);

    border:
        1px solid
        rgba(16,185,129,.35);

    color:#50e5b3;

    transform:
        translateZ(25px);

    box-shadow:
        0 0 15px
        rgba(16,185,129,.08);
}


/* =========================================================
   FEATURE CARDS
========================================================= */

.feature-item{

    display:flex;

    align-items:center;

    gap:14px;

    padding:
        12px 14px;

    border-radius:17px;

    background:
        linear-gradient(
            100deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    transform:
        translateZ(25px);

    box-shadow:

        inset 0 1px
        rgba(255,255,255,.04),

        0 8px 20px
        rgba(0,0,0,.15);
}


/* =========================================================
   DOWNLOAD BUTTON
========================================================= */

.btn-3d-container{

    margin-top:25px;

    transform:
        translateZ(55px);
}

.btn-3d{

    position:relative;

    width:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:17px;

    border-radius:20px;

    color:#fff;

    text-decoration:none;

    font-size:1.13rem;

    font-weight:900;

    letter-spacing:1px;

    background:
        linear-gradient(
            180deg,
            #5b9cff 0%,
            #2865e6 48%,
            #1948b9 100%
        );

    border:
        1px solid
        #82b7ff;

    box-shadow:

        0 9px 0
        #102c6d,

        0 20px 35px
        rgba(37,99,235,.45),

        inset 0 2px 3px
        rgba(255,255,255,.45);

    overflow:hidden;

    transition:.15s;
}


/* button shine */

.btn-3d::before{

    content:"";

    position:absolute;

    top:-100%;
    left:-50%;

    width:30%;
    height:300%;

    background:
        rgba(255,255,255,.35);

    transform:
        rotate(25deg);

    animation:
        buttonShine 3.5s
        infinite;
}

@keyframes buttonShine{

    0%{
        left:-50%;
    }

    55%,100%{
        left:140%;
    }

}

.btn-3d:active{

    transform:
        translateY(8px);

    box-shadow:

        0 2px 0
        #102c6d,

        0 8px 15px
        rgba(37,99,235,.4),

        inset 0 2px 3px
        rgba(255,255,255,.35);
}


/* =========================================================
   VERIFIED
========================================================= */

.verified{

    margin-top:18px;

    color:#687795;

    font-size:9px;

    font-weight:800;

    letter-spacing:2px;
}

.verified i{

    color:#22c55e;

    margin-right:5px;

    filter:
        drop-shadow(
            0 0 5px
            #22c55e
        );
}


/* =========================================================
   SMALL SCREENS
========================================================= */

@media(max-height:720px){

    .card-container{
        transform:scale(.88);
    }

}

@media(max-height:650px){

    .card-container{
        transform:scale(.78);
    }

}

@media(max-width:360px){

    .card-container{
        padding:11px;
    }

    .glass-card{
        padding:
            22px 17px 20px;
    }

    .app-name{
        font-size:2rem;
    }

    .app-icon-wrapper{
        width:90px;
        height:110px;
    }

}

</style>
</head>

<script>

/* =========================================================
   CREATE CROWD
========================================================= */

const crowd =
    document.getElementById("crowd");

for(let i=0;i<28;i++){

    const person =
        document.createElement("div");

    person.className="person";

    const scale =
        0.65 +
        Math.random()*0.65;

    person.style.transform =
        `scale(${scale})`;

    person.style.animationDelay =
        `${Math.random()*3}s`;

    person.innerHTML = `

        <div class="head"></div>

        <div class="body"></div>

        <div class="arm left"></div>

        <div class="arm right"></div>

        <div class="leg left"></div>

        <div class="leg right"></div>

    `;

    crowd.appendChild(person);
}


/* =========================================================
   CITY RANDOM LIGHTS
========================================================= */

const city =
    document.querySelector(".city");

for(let i=0;i<50;i++){

    const light =
        document.createElement("span");

    light.className="cityLight";

    light.style.left =
        Math.random()*100 + "%";

    light.style.bottom =
        (Math.random()*65 + 10) + "%";

    light.style.animationDelay =
        Math.random()*2 + "s";

    city.appendChild(light);
}


/* =========================================================
   3D TILT
========================================================= */

const card =
    document.getElementById("tiltCard");

const container =
    document.querySelector(".card-container");


function applyTilt(x,y){

    const rect =
        card.getBoundingClientRect();

    const centerX =
        rect.width / 2;

    const centerY =
        rect.height / 2;

    const rotateX =
        ((y-centerY)/centerY)*-8;

    const rotateY =
        ((x-centerX)/centerX)*8;

    container.style.transform =
        `
        rotateX(${rotateX}deg)
        rotateY(${rotateY}deg)
        `;
}


/* =========================================================
   DESKTOP MOUSE
========================================================= */

card.addEventListener(
    "mousemove",
    function(e){

        const rect =
            card.getBoundingClientRect();

        applyTilt(
            e.clientX - rect.left,
            e.clientY - rect.top
        );

    }
);


card.addEventListener(
    "mouseleave",
    function(){

        container.style.transform =
            "rotateX(0deg) rotateY(0deg)";

    }
);


/* =========================================================
   MOBILE TOUCH
========================================================= */

card.addEventListener(
    "touchmove",
    function(e){

        const touch =
            e.touches[0];

        const rect =
            card.getBoundingClientRect();

        applyTilt(
            touch.clientX - rect.left,
            touch.clientY - rect.top
        );

    },
    {
        passive:true
    }
);


card.addEventListener(
    "touchend",
    function(){

        container.style.transform =
            "rotateX(0deg) rotateY(0deg)";

    }
);

</script>
