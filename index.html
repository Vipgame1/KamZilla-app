(function(){

/* =====================  LUXURY 3D WORLD  ===================== */
function buildWorld(){
  const low=(navigator.hardwareConcurrency||4)<=4,AD=THREE.AdditiveBlending,T=Math.tan(25*Math.PI/180);
  const R=new THREE.WebGLRenderer({canvas:$('#bg'),antialias:!low});
  R.setPixelRatio(Math.min(devicePixelRatio||1,low?1:1.5));
  const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,1,500),items=[];
  S.background=new THREE.Color(0x050403);cam.position.set(0,4,52);
  function place(){items.forEach(m=>{const u=m.userData,hh=(52-u.z)*T;u.bx=u.nx*hh*cam.aspect*.9;u.by=u.ny*hh;m.position.set(u.bx,u.by,u.z)})}
  function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();place()}

  /* lights */
  S.add(new THREE.AmbientLight(0x2a2016,1));
  const l1=new THREE.PointLight(0xffc766,1.7,260);l1.position.set(-30,30,40);S.add(l1);
  const l2=new THREE.PointLight(0xfff1d0,1.2,260);l2.position.set(30,12,45);S.add(l2);
  const l3=new THREE.PointLight(0x7a9cff,.5,200);l3.position.set(0,-10,40);S.add(l3);

  /* flowing gold silk */
  const sk=new THREE.Mesh(new THREE.PlaneGeometry(170,120,low?100:160,low?70:110),new THREE.ShaderMaterial({uniforms:{t:{value:0}},
    vertexShader:[
      'uniform float t;varying vec3 vN;varying vec3 vV;varying float vH;',
      'float H(vec2 p){return sin(p.x*.11+t*.5)*2.8+sin(p.y*.17-t*.4+p.x*.05)*2.3+sin((p.x+p.y)*.09+t*.3)*1.9+sin(p.x*.23-p.y*.13+t*.7)*.8;}',
      'void main(){vec3 p=position;float e=.35;float h=H(p.xy);float hx=H(p.xy+vec2(e,0.));float hy=H(p.xy+vec2(0.,e));',
      'vec3 n=normalize(vec3(-(hx-h)/e,-(hy-h)/e,1.));vN=normalize(normalMatrix*n);vH=h;p.z=h;',
      'vec4 mv=modelViewMatrix*vec4(p,1.);vV=-mv.xyz;gl_Position=projectionMatrix*mv;}'].join('\n'),
    fragmentShader:[
      'varying vec3 vN;varying vec3 vV;varying float vH;',
      'void main(){vec3 n=normalize(vN);vec3 v=normalize(vV);vec3 L=normalize(vec3(-.35,.75,.55));vec3 hv=normalize(L+v);',
      'float d=max(dot(n,L),0.);float s=pow(max(dot(n,hv),0.),70.);float fr=pow(1.-max(dot(n,v),0.),3.);',
      'vec3 c=mix(vec3(.03,.022,.012),vec3(.62,.42,.1),d*d)+vec3(1.,.84,.5)*s*1.2+vec3(.85,.6,.22)*fr*.3;',
      'c+=vec3(.95,.75,.35)*smoothstep(.46,.5,abs(fract(vH*.8)-.5))*.09;',
      'float f=clamp(length(vV)/170.,0.,1.);c=mix(c,vec3(.02,.015,.01),f*f);gl_FragColor=vec4(c,1.);}'].join('\n')}));
  sk.rotation.x=-1.2;sk.position.set(0,-17,-12);S.add(sk);

  /* soft bokeh lights */
  const bc=document.createElement('canvas');bc.width=bc.height=128;const bx=bc.getContext('2d'),gr=bx.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');
  bx.fillStyle=gr;bx.fillRect(0,0,128,128);const bt=new THREE.CanvasTexture(bc);
  for(let i=0;i<18;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:bt,color:i%4?0xf2b84b:0xfff0c8,transparent:true,opacity:.1+Math.random()*.22,blending:AD,depthWrite:false})),k=6+Math.random()*16;
    s.scale.set(k,k,1);s.userData={nx:Math.random()*2-1,ny:Math.random()*1.7-.6,z:-35+Math.random()*30,p:Math.random()*6,sp:.15+Math.random()*.3};
    items.push(s);S.add(s);
  }

  /* polished gold gems */
  const gold=new THREE.MeshPhongMaterial({color:0xe0b34a,shininess:160,specular:0xfff2c0});
  const geos=[new THREE.OctahedronGeometry(1.5),new THREE.SphereGeometry(1.1,32,24),new THREE.TorusGeometry(1.3,.32,24,64),new THREE.IcosahedronGeometry(1.2,0)];
  for(let i=0;i<9;i++){
    const k=i%4,m=new THREE.Mesh(geos[k],(k===0||k===3)?new THREE.MeshPhongMaterial({color:i%2?0xfff1c8:0xf5d77a,shininess:150,specular:0xffffff,flatShading:true}):gold),sc=.7+Math.random()*.9;
    m.scale.set(sc,sc*(k===0?1.5:1),sc);
    m.userData={nx:Math.random()*2-1,ny:Math.random()*1.5-.2,z:-14+Math.random()*26,p:Math.random()*6,sp:.2+Math.random()*.3,rs:.004+Math.random()*.01};
    items.push(m);S.add(m);
  }

  /* gold dust */
  const DN=low?350:700,dp=new Float32Array(DN*3),dv=[];
  for(let i=0;i<DN;i++){dp[i*3]=(Math.random()-.5)*110;dp[i*3+1]=Math.random()*60-22;dp[i*3+2]=-40+Math.random()*80;dv.push(.8+Math.random()*2)}
  const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(dp,3));
  S.add(new THREE.Points(dg,new THREE.PointsMaterial({size:.55,map:bt,color:0xffd98a,transparent:true,opacity:.9,blending:AD,depthWrite:false})));

  size();addEventListener('resize',size);
  let last=0;
  return function(ms){
    const t=ms/1000,dt=Math.min(.05,t-last);last=t;
    sk.material.uniforms.t.value=t;
    cam.position.set(sx*5,4-sy*3+Math.sin(t*.2)*.8,52);cam.lookAt(-sx*1.5,-1,0);
    l1.position.x=-30+Math.sin(t*.3)*18;l2.position.y=12+Math.cos(t*.25)*8;
    items.forEach(m=>{const u=m.userData;
      m.position.x=u.bx+Math.sin(t*u.sp+u.p)*1.4;m.position.y=u.by+Math.cos(t*u.sp*.8+u.p)*1.1;
      if(u.rs){m.rotation.x+=u.rs;m.rotation.y+=u.rs*1.4}});
    for(let i=0;i<DN;i++){dp[i*3+1]+=dv[i]*dt*.9;dp[i*3]+=Math.sin(t*.5+i)*dt*.6;if(dp[i*3+1]>40)dp[i*3+1]=-24}
    dg.attributes.position.needsUpdate=true;
    R.render(S,cam);
  };
}
try{world=buildWorld()}catch(err){console.warn('3D background off',err)}

/* main loop: card tilt + 3D scene */
const box=$('#box');
(function loop(t){

/* =====================  SOUND  =====================
   1) bgsong.mp3 (agar repo mein hai)  2) warna built-in luxury lounge track
      (chill beat + pad + pluck + bansuri-style flute, Bhoopali scale) */
const Snd=(()=>{
  let ctx,master,pad,cv,dl,nb,au=null,mode='',started=false,on=false,want=true,ss=false,nt=0,st=0,lastP=0,lastF=76;
  try{want=localStorage.getItem('kz_snd')!=='0'}catch(e){}
  const b=$('#snd'),f=m=>440*Math.pow(2,(m-69)/12),SX=60/84/4;
  const CH=[{r:36,p:[52,55,59,62,64],a:[60,64,67,71,72,76,79]},{r:33,p:[52,55,59,60,64],a:[57,60,64,67,69,72,76]},
            {r:41,p:[52,57,60,64,67],a:[60,64,65,69,72,76,77]},{r:43,p:[53,57,59,62,64],a:[59,62,65,67,69,71,74]}];
  const PEN=[72,74,76,79,81,84];
  function ui(){
    b.innerHTML='<i class="fa-solid '+(on?'fa-volume-high':'fa-volume-xmark')+'"></i>';
    b.classList.toggle('hint',want&&!started);
    b.setAttribute('aria-label',on?'Sound band karo':'Sound chalao');
  }
  function init(){
    ctx=new(window.AudioContext||window.webkitAudioContext)();
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-22;comp.ratio.value=3.5;comp.attack.value=.01;comp.release.value=.3;
    master=ctx.createGain();master.gain.value=0;master.connect(comp);comp.connect(ctx.destination);
    cv=ctx.createConvolver();const L=ctx.sampleRate*3.6,ir=ctx.createBuffer(2,L,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,2.4)}
    cv.buffer=ir;const wet=ctx.createGain();wet.gain.value=.75;cv.connect(wet);wet.connect(master);
    pad=ctx.createBiquadFilter();pad.type='lowpass';pad.frequency.value=1500;pad.Q.value=.5;pad.connect(master);pad.connect(cv);
    dl=ctx.createDelay(1.5);dl.delayTime.value=SX*3;
    const fb=ctx.createGain();fb.gain.value=.38;const tn=ctx.createBiquadFilter();tn.type='lowpass';tn.frequency.value=2600;
    dl.connect(tn);tn.connect(fb);fb.connect(dl);tn.connect(master);tn.connect(cv);
    nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.08;lg.gain.value=450;lfo.connect(lg);lg.connect(pad.frequency);lfo.start();
  }
  function tone(t,fr,type,pk,a,d,dst){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=fr;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);
    o.connect(g);dst.forEach(x=>g.connect(x));o.start(t);o.stop(t+a+d+.05);
  }
  function nz(t,type,fr,pk,d,dst){
    const s=ctx.createBufferSource(),fl=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nb;fl.type=type;fl.frequency.value=fr;fl.Q.value=.9;
    g.gain.setValueAtTime(pk,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);dst.forEach(x=>g.connect(x));s.start(t,Math.random()*.5);s.stop(t+d+.05);
  }
  function padChord(t,c){
    const D=6.6;
    c.p.forEach(m=>[['sawtooth',-8,.009],['sine',6,.018]].forEach(v=>{
      const o=ctx.createOscillator(),g=ctx.createGain();o.type=v[0];o.frequency.value=f(m);o.detune.value=v[1];
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v[2],t+1.3);g.gain.setValueAtTime(v[2],t+D-2);g.gain.linearRampToValueAtTime(0,t+D);
      o.connect(g);g.connect(pad);o.start(t);o.stop(t+D+.05);
    }));
  }
  function kick(t){
    const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(48,t+.16);
    g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.0001,t+.34);o.connect(g);g.connect(master);o.start(t);o.stop(t+.36);
  }
  function bass(t,m,d){tone(t,f(m),'sine',.26,.012,d,[master]);tone(t,f(m+12),'triangle',.07,.012,d*.7,[master])}
  function pluck(t,m){tone(t,f(m),'triangle',.075,.004,1,[master,cv,dl]);tone(t,f(m+12),'sine',.025,.004,.5,[cv,dl])}
  function flute(t,m,len){
    const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain(),lf=ctx.createOscillator(),lg=ctx.createGain();
    o.type='sine';o2.type='triangle';
    [o,o2].forEach(x=>{x.frequency.setValueAtTime(f(m-2),t);x.frequency.exponentialRampToValueAtTime(f(m),t+.09)});
    lf.frequency.value=5.2;lg.gain.value=7;lf.connect(lg);lg.connect(o.detune);lg.connect(o2.detune);
    g2.gain.value=.3;o2.connect(g2);g2.connect(g);o.connect(g);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.12);g.gain.setValueAtTime(.06,t+len-.25);g.gain.linearRampToValueAtTime(0,t+len);
    g.connect(master);g.connect(cv);g.connect(dl);
    [o,o2,lf].forEach(x=>{x.start(t);x.stop(t+len+.05)});
  }
  function step(s,t){
    const bar=s%16,c=CH[(s>>5)%4];
    if(s%32===0)padChord(t,c);
    if(bar===0)bass(t,c.r,2.2);
    if(bar===10)bass(t,c.r+7,1.2);
    if(bar%8===0)kick(t);
    if(bar===4||bar===12)nz(t,'bandpass',1900,.09,.12,[master,cv]);
    if(bar%2===0)nz(t+(bar%4===2?.02:0),'highpass',7500,bar===14?.05:.03,bar===14?.18:.05,[master]);
    if([0,3,6,8,10,12,14].indexOf(bar)>-1&&Math.random()<.78){let m;do{m=c.a[Math.random()*c.a.length|0]}while(m===lastP);lastP=m;pluck(t,m)}
    if((bar===2||bar===8)&&Math.random()<.7){
      let i=PEN.indexOf(lastF)+(Math.random()*3|0)-1;i=Math.max(0,Math.min(PEN.length-1,i));lastF=PEN[i];flute(t,lastF,SX*(bar===2?6:8));
    }
    if(s%32===16&&Math.random()<.5)tone(t,f(c.a[c.a.length-1]+12),'sine',.035,.01,2.6,[cv,master]);
  }
  function pump(){
    if(!(on&&mode==='synth'&&ctx&&ctx.state==='running'))return;
    while(nt<ctx.currentTime+.18){step(st,nt);nt+=SX;st++}
  }
  function synth(){
    mode='synth';if(!ctx)init();
    ctx.resume();master.gain.setTargetAtTime(.9,ctx.currentTime,.9);
    if(!ss){ss=true;nt=ctx.currentTime+.1;setInterval(pump,40)}else nt=Math.max(nt,ctx.currentTime+.05);
    started=true;ui();
  }
  /* ---- song file ---- */
  function fade(to){
    clearInterval(fade.i);
    fade.i=setInterval(()=>{const d=to-au.volume;
      if(Math.abs(d)<.03){au.volume=to;clearInterval(fade.i);if(!to)au.pause()}
      else au.volume=Math.max(0,Math.min(1,au.volume+d*.15))},60);
  }
  function toSynth(){if(mode!=='synth'&&on)synth()}
  function play(){
    on=true;ui();
    if(mode==='synth')return synth();
    if(!au){au=new Audio(MUSIC_URL);au.loop=true;au.preload='auto';au.volume=0;au.addEventListener('error',toSynth)}
    mode='file';
    au.play().then(()=>{started=true;fade(.5);ui()}).catch(e=>{
      if(e&&e.name==='NotAllowedError'){on=false;ui()}else toSynth();
    });
  }
  function mute(){
    on=false;
    if(mode==='file'&&au)fade(0);
    else if(ctx){master.gain.setTargetAtTime(0,ctx.currentTime,.3);setTimeout(()=>{if(!on)ctx.suspend()},1400)}
    ui();
  }
  function save(){try{localStorage.setItem('kz_snd',on?'1':'0')}catch(e){}}
  function unlock(e){
    if(started||on||!want)return;
    if(e.target&&e.target.closest&&e.target.closest('#snd'))return;
    play();
  }
  ['pointerup','touchend','click','keydown'].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
  b.addEventListener('click',()=>{if(!on){want=true;play()}else{want=false;mute()}save()});
  document.addEventListener('visibilitychange',()=>{
    if(!started)return;
    if(document.hidden){if(au&&mode==='file')au.pause();if(ctx)ctx.suspend()}
    else if(on){if(au&&mode==='file')au.play().catch(()=>{});if(ctx&&mode==='synth')ctx.resume()}
  });
  ui();
})();

$('#refreshBtn').addEventListener('click',function(){
  this.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Refreshing...';
  setTimeout(()=>{location.replace(location.href.split('?')[0]+'?fresh='+Date.now())},500);
});
$('.logo-face img').addEventListener('error',function(){
  this.src='https://i.ibb.co/35fS6sHm/1000571878.png?reload='+Date.now();
});
})();
</script>
