<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Download KamZilla</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #02040a;
            color: white;
            overflow: hidden;
            perspective: 1000px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        /* --- BACKGROUND: 3D City Skyline & Fireworks --- */
        .bg-scene {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background: linear-gradient(180deg, #02040a 0%, #0a1128 40%, #1a2a6c 100%);
        }

        /* Stars */
        .stars {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 50px 160px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 160px 120px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.5;
            animation: twinkle 4s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        /* City Buildings */
        .city {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 5px;
            filter: drop-shadow(0 -10px 20px rgba(59, 130, 246, 0.2));
        }

        .building {
            background: #0f172a;
            width: 30px;
            border-radius: 5px 5px 0 0;
            position: relative;
            border-top: 1px solid rgba(59, 130, 246, 0.3);
        }

        .building::after {
            content: '';
            position: absolute;
            inset: 10% 20%;
            background: repeating-linear-gradient(0deg, transparent, transparent 5px, rgba(250, 204, 21, 0.2) 5px, rgba(250, 204, 21, 0.2) 6px);
        }

        /* Random building heights and widths */
        .b1 { height: 120px; width: 40px; }
        .b2 { height: 80px; width: 25px; }
        .b3 { height: 150px; width: 35px; }
        .b4 { height: 100px; width: 30px; }
        .b5 { height: 180px; width: 45px; }
        .b6 { height: 90px; width: 20px; }
        .b7 { height: 130px; width: 35px; }
        .b8 { height: 70px; width: 25px; }
        .b9 { height: 160px; width: 40px; }
        .b10 { height: 110px; width: 30px; }

        /* Fireworks */
        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: shoot 2s infinite;
        }

        .fw1 { top: 10%; left: 20%; background: #fbbf24; box-shadow: 0 0 20px #fbbf24, 0 0 40px #fbbf24; animation-delay: 0s; }
        .fw2 { top: 20%; left: 80%; background: #3b82f6; box-shadow: 0 0 20px #3b82f6, 0 0 40px #3b82f6; animation-delay: 0.7s; }
        .fw3 { top: 5%; left: 50%; background: #ec4899; box-shadow: 0 0 20px #ec4899, 0 0 40px #ec4899; animation-delay: 1.5s; }
        .fw4 { top: 30%; left: 10%; background: #10b981; box-shadow: 0 0 20px #10b981, 0 0 40px #10b981; animation-delay: 2.1s; }
        .fw5 { top: 15%; left: 90%; background: #f59e0b; box-shadow: 0 0 20px #f59e0b, 0 0 40px #f59e0b; animation-delay: 3s; }

        @keyframes shoot {
            0% { transform: scale(0); opacity: 1; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* --- 3D TILT CARD CONTAINER --- */
        .card-container {
            width: 100%;
            max-width: 380px;
            padding: 20px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
            z-index: 10;
        }

        /* --- GLASSMORPHISM CARD --- */
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 35px 25px;
            position: relative;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                inset 0 -1px 0 rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
        }

        /* Animated Top Border */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #3b82f6, #8b5cf6, transparent);
            border-radius: 50%;
            z-index: 10;
        }

        /* --- ORIGINAL APP ICON (3D FLOATING) --- */
        .app-icon-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
            border-radius: 22px;
            position: relative;
            transform: translateZ(50px);
            animation: float 4s ease-in-out infinite;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.6),
                0 5px 15px rgba(59, 130, 246, 0.4),
                inset 0 2px 5px rgba(255, 255, 255, 0.3);
            background: #0f172a;
            border: 2px solid rgba(96, 165, 250, 0.5);
        }

        .app-icon-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotateZ(0deg); }
            50% { transform: translateY(-10px) rotateZ(2deg); }
        }

        /* --- TEXT STYLING --- */
        .app-name {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(to right, #ffffff, #93c5fd, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(59,130,246,0.3);
            transform: translateZ(30px);
            letter-spacing: 2px;
        }

        /* --- FEATURES LIST --- */
        .feature-item {
            display: flex; align-items: center; gap: 15px;
            background: rgba(255,255,255,0.05);
            padding: 12px 15px; border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            transform: translateZ(20px);
            transition: 0.3s;
        }
        .feature-item:hover {
            background: rgba(255,255,255,0.1);
            transform: translateZ(25px) scale(1.02);
        }

        /* --- ULTIMATE 3D BUTTON --- */
        .btn-3d-container {
            transform: translateZ(40px);
            margin-top: 30px;
        }
        .btn-3d {
            display: flex; justify-content: center; align-items: center;
            width: 100%; padding: 18px;
            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
            border-radius: 20px;
            border: 1px solid #60a5fa;
            color: white; font-size: 1.2rem; font-weight: 800; letter-spacing: 1px;
            text-decoration: none;
            position: relative;
            box-shadow: 
                0 10px 0 #172554, /* Solid 3D bottom */
                0 20px 30px rgba(37, 99, 235, 0.4), /* Glow */
                inset 0 2px 2px rgba(255, 255, 255, 0.4); /* Top highlight */
            transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-3d:active {
            transform: translateY(8px); /* Press down */
            box-shadow: 
                0 2px 0 #172554, 
                0 5px 15px rgba(37, 99, 235, 0.4),
                inset 0 2px 2px rgba(255, 255, 255, 0.4);
        }
        .btn-3d::after { /* Shine effect */
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 50%;
            background: linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0));
            border-radius: 20px 20px 0 0; pointer-events: none;
        }

        .badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex; align-items: center; gap: 5px;
            transform: translateZ(15px);
        }

    </style>
</head>
<body>

    <!-- 3D Background Scene -->

        <!-- Fireworks -->

        <!-- City Skyline -->
        <div class="city">

            <div class="building b2"></div>

            <div class="building b4"></div>

    <div class="card-container" id="tiltCard">
        
        <div class="glass-card text-center">

                   download="KamZillaNew.apk"

                </a>

    <!-- JavaScript for 3D Tilt Effect -->
    <script>
        const card = document.getElementById('tiltCard');
        const container = document.querySelector('.card-container');

        // PC Mouse Move
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = ((y - centerY) / centerY) * -10; // Max 10 deg
            const rotateY = ((x - centerX) / centerX) * 10;

            container.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        card.addEventListener('mouseleave', () => {
            container.style.transform = `rotateX(0deg) rotateY(0deg)`;
            container.style.transition = 'transform 0.5s ease';
        });

        card.addEventListener('mouseenter', () => {
            container.style.transition = 'transform 0.1s ease';
        });

        // Mobile Touch Move (Gyro-like effect)
        card.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const rect = card.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = ((y - centerY) / centerY) * -10;
            const rotateY = ((x - centerX) / centerX) * 10;

            container.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        }, { passive: true });

        card.addEventListener('touchend', () => {
            container.style.transform = `rotateX(0deg) rotateY(0deg)`;
            container.style.transition = 'transform 0.5s ease';
        });
    </script>
