<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:'Outfit',sans-serif;color:#fff;display:flex;justify-content:center;align-items:center;perspective:1600px;
background:radial-gradient(circle at 50% 25%,#2a1c08,#0b0805 55%,#030202)}

/* 3D WORLD (three.js) */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-20;display:block}
.vig{position:fixed;inset:0;z-index:-10;pointer-events:none;
background:radial-gradient(130% 95% at 50% 45%,transparent 55%,rgba(3,2,1,.75)),
linear-gradient(180deg,rgba(3,2,1,.35),transparent 22%,transparent 78%,rgba(3,2,1,.45))}

/* SOUND BUTTON */
#snd{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:40;width:44px;height:44px;border-radius:50%;
border:1px solid rgba(245,215,122,.4);background:rgba(20,14,6,.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
color:#f5d77a;font-size:16px;cursor:pointer;display:grid;place-items:center}
#snd.hint::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #f5d77a;animation:ping 1.6s infinite}
@keyframes ping{from{transform:scale(.8);opacity:.9}to{transform:scale(1.5);opacity:0}}

/* CARD */
.card-container{width:100%;max-width:395px;padding:15px;z-index:30;
transform:scale(var(--s,1)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.glass-card{position:relative;padding:25px 20px 20px;border-radius:34px;
background:linear-gradient(145deg,rgba(30,22,10,.58),rgba(8,6,3,.74));
border:1px solid rgba(245,215,122,.3);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
box-shadow:0 40px 80px rgba(0,0,0,.7),0 0 80px rgba(224,179,74,.18),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.6)}
.glass-card::before{content:"";position:absolute;inset:-2px;border-radius:36px;z-index:-1;opacity:.45;filter:blur(5px);
background:linear-gradient(120deg,transparent,rgba(224,179,74,.7),rgba(255,240,184,.5),rgba(180,120,30,.65),transparent)}
.glass-card::after{content:"";position:absolute;top:0;left:12%;right:12%;height:2px;
background:linear-gradient(90deg,transparent,#e0b34a,#fff0b8,#e0b34a,transparent);box-shadow:0 0 16px #e0b34a}

/* LOGO */
.app-logo-3d{position:relative;width:110px;height:110px;margin:0 auto 18px;transform-style:preserve-3d;
transform:perspective(900px) rotateX(7deg) rotateY(-8deg) translateZ(70px);animation:logoFloat 4s ease-in-out infinite;
filter:drop-shadow(0 25px 25px rgba(0,0,0,.7)) drop-shadow(0 0 25px rgba(245,190,70,.5))}
.logo-face{position:absolute;inset:0;border-radius:22px;overflow:hidden;background:#07132d;border:2px solid rgba(245,215,122,.9);transform:translateZ(15px);
box-shadow:inset 0 2px 5px rgba(255,255,255,.45),inset 0 -15px 25px rgba(0,0,0,.45);z-index:10}
.logo-face img{display:block;width:100%;height:100%;object-fit:contain;background:#07132d;border-radius:20px;position:relative;z-index:20}
.logo-shine{position:absolute;inset:0;z-index:30;pointer-events:none;border-radius:21px;
background:linear-gradient(135deg,rgba(255,255,255,.24),transparent 30%,transparent 70%,rgba(255,255,255,.08))}
.logo-side{position:absolute;top:6px;right:-12px;width:14px;height:98px;border-radius:0 12px 12px 0;
background:linear-gradient(90deg,#d4a43a,#3a2608);border:1px solid rgba(245,215,122,.5);transform:rotateY(90deg) translateZ(6px);transform-origin:left center;z-index:1}
.logo-top{position:absolute;top:-12px;left:6px;width:98px;height:14px;border-radius:12px 12px 0 0;
background:linear-gradient(180deg,#f9e29a,#a8741c);transform:rotateX(90deg) translateZ(6px);transform-origin:center bottom;z-index:1}
@keyframes logoFloat{
0%,100%{transform:perspective(900px) rotateX(7deg) rotateY(-8deg) translateY(0) translateZ(70px)}
50%{transform:perspective(900px) rotateX(3deg) rotateY(8deg) translateY(-8px) translateZ(85px)}}

/* NAME + BADGES */

background:linear-gradient(90deg,#fff,#f5d77a,#fff,#e0b34a,#fff);background-size:250% auto;

.ref-row{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:6px 10px}

.copy-btn{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:.75rem;font-weight:800;cursor:pointer;transition:.2s;box-shadow:0 4px 12px rgba(16,185,129,.3)}
.copy-btn:active{transform:scale(.95)}
.copy-btn.copied{background:#22c55e}
.notice-text{font-size:.7rem;color:#fca5a5;margin-top:6px;text-align:center;font-weight:500}

/* DOWNLOAD BUTTON */
.btn-3d{position:relative;width:100%;min-height:62px;display:flex;align-items:center;justify-content:center;border-radius:18px;
color:#2a1a05;text-decoration:none;font-size:1.05rem;font-weight:900;letter-spacing:1px;overflow:hidden;transition:.15s;
background:linear-gradient(180deg,#fbe7a3 0%,#e0b34a 52%,#a8741c 100%);border:1px solid #fff0b8;
box-shadow:0 8px 0 #5c3d0c,0 18px 30px rgba(224,179,74,.4),inset 0 2px 3px rgba(255,255,255,.5)}
.btn-3d:active{transform:translateY(7px);box-shadow:0 1px 0 #5c3d0c,0 6px 12px rgba(224,179,74,.4)}
.btn-3d::before{content:"";position:absolute;top:-100%;left:-50%;width:28%;height:300%;background:rgba(255,255,255,.35);transform:rotate(25deg);animation:shine 3.5s infinite}
@keyframes shine{0%{left:-50%}55%,100%{left:140%}}

.refresh-btn{margin:15px auto 0;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:18px;
color:#a3b6da;background:rgba(255,255,255,.05);border:1px solid rgba(130,160,220,.2);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:.2s}
.refresh-btn:active{transform:scale(.94);background:rgba(59,130,246,.12);color:#b9d1ff}
.verified{margin-top:10px;color:#7d8cab;font-size:9px;font-weight:800;letter-spacing:2px}
.verified i{color:#22c55e;margin-right:4px;filter:drop-shadow(0 0 5px #22c55e)}

@media(max-height:750px){.card-container{--s:.85}}
@media(max-height:650px){.card-container{--s:.75}}
</style>
</head>
<body>

<script>
(function(){
const $=s=>document.querySelector(s);
let px=0,py=0,sx=0,sy=0,world=null;

/* ==== REFERRAL LOGIC ==== */
const urlParams=new URLSearchParams(window.location.search);
const refCode=urlParams.get('ref');
const dlBtn=$('#downloadBtn');
const refSec=$('#refSection');
const copyBtn=$('#copyRefBtn');
const dispCode=$('#displayRefCode');
const refNotice=$('#refNotice');

if(refCode){
  refSec.style.display='block';
  dispCode.textContent=refCode;
  // Referral aaya hai toh shuru mein download button chupayein jab tak copy na ho
  dlBtn.style.display='none';

  copyBtn.addEventListener('click',function(){
    navigator.clipboard.writeText(refCode).then(()=>{
      copyBtn.innerHTML='<i class="fa-solid fa-check mr-1"></i> Copied!';
      copyBtn.classList.add('copied');
      refNotice.style.color='#4ee4b0';
      refNotice.innerHTML='🎉 Code Copied Successfully! Download Unlocked.';
      // Download button smooth fade / display unlock
      dlBtn.style.display='flex';
    }).catch(err=>{
      // Fallback
      alert('Invite Code: '+refCode);
      dlBtn.style.display='flex';
    });
  });
}

const MUSIC_URL='bgsong.mp3';
addEventListener('pointermove',e=>{px=e.clientX/innerWidth-.5;py=e.clientY/innerHeight-.5},{passive:true});

/* =====================  3D WORLD  ===================== */
function buildWorld(){
  const low=(navigator.hardwareConcurrency||4)<=4,AD=THREE.AdditiveBlending,T=Math.tan(25*Math.PI/180);
  const R=new THREE.WebGLRenderer({canvas:$('#bg'),antialias:!low});
  R.setPixelRatio(Math.min(devicePixelRatio||1,low?1:1.5));
  const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,1,500),items=[];
  S.background=new THREE.Color(0x050403);cam.position.set(0,4,52);
  function place(){items.forEach(m=>{const u=m.userData,hh=(52-u.z)*T;u.bx=u.nx*hh*cam.aspect*.9;u.by=u.ny*hh;m.position.set(u.bx,u.by,u.z)})}
  function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();place()}

  S.add(new THREE.AmbientLight(0x2a2016,1));
  const l1=new THREE.PointLight(0xffc766,1.7,260);l1.position.set(-30,30,40);S.add(l1);
  const l2=new THREE.PointLight(0xfff1d0,1.2,260);l2.position.set(30,12,45);S.add(l2);

  const sk=new THREE.Mesh(new THREE.PlaneGeometry(170,120,low?100:160,low?70:110),new THREE.ShaderMaterial({uniforms:{t:{value:0}},
    vertexShader:[
      'uniform float t;varying vec3 vN;varying vec3 vV;varying float vH;',
      'float H(vec2 p){return sin(p.x*.11+t*.5)*2.8+sin(p.y*.17-t*.4+p.x*.05)*2.3+sin((p.x+p.y)*.09+t*.3)*1.9+sin(p.x*.23-p.y*.13+t*.7)*.8;}',
      'void main(){vec3 p=position;float e=.35;float h=H(p.xy);float hx=H(p.xy+vec2(e,0.));float hy=H(p.xy+vec2(0.,e));',
      'vec3 n=normalize(vec3(-(hx-h)/e,-(hy-h)/e,1.));vN=normalize(normalMatrix*n);vH=h;p.z=h;',
      'vec4 mv=modelViewMatrix*vec4(p,1.);vV=-mv.xyz;gl_Position=projectionMatrix*mv;}'].join('\n'),
    fragmentShader:[
      'varying vec3 vN;varying vec3 vV;varying float vH;',
      'void main(){vec3 n=normalize(vN);vec3 v=normalize(vV);vec3 L=normalize(vec3(-.35,.75,.55));vec3 hv=normalize(L+v);',
      'float d=max(dot(n,L),0.);float s=pow(max(dot(n,hv),0.),70.);float fr=pow(1.-max(dot(n,v),0.),3.);',
      'vec3 c=mix(vec3(.03,.022,.012),vec3(.62,.42,.1),d*d)+vec3(1.,.84,.5)*s*1.2+vec3(.85,.6,.22)*fr*.3;',
      'c+=vec3(.95,.75,.35)*smoothstep(.46,.5,abs(fract(vH*.8)-.5))*.09;',
      'float f=clamp(length(vV)/170.,0.,1.);c=mix(c,vec3(.02,.015,.01),f*f);gl_FragColor=vec4(c,1.);}'].join('\n')}));
  sk.rotation.x=-1.2;sk.position.set(0,-17,-12);S.add(sk);

  const bc=document.createElement('canvas');bc.width=bc.height=128;const bx=bc.getContext('2d'),gr=bx.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');
  bx.fillStyle=gr;bx.fillRect(0,0,128,128);const bt=new THREE.CanvasTexture(bc);
  
  for(let i=0;i<12;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:bt,color:0xf2b84b,transparent:true,opacity:.15,blending:AD,depthWrite:false})),k=6+Math.random()*14;
    s.scale.set(k,k,1);s.userData={nx:Math.random()*2-1,ny:Math.random()*1.7-.6,z:-35+Math.random()*25,p:Math.random()*6,sp:.15+Math.random()*.3};
    items.push(s);S.add(s);
  }

  size();addEventListener('resize',size);
  let last=0;
  return function(ms){
    const t=ms/1000,dt=Math.min(.05,t-last);last=t;
    sk.material.uniforms.t.value=t;
    cam.position.set(sx*5,4-sy*3+Math.sin(t*.2)*.8,52);cam.lookAt(-sx*1.5,-1,0);
    items.forEach(m=>{const u=m.userData;
      m.position.x=u.bx+Math.sin(t*u.sp+u.p)*1.4;m.position.y=u.by+Math.cos(t*u.sp*.8+u.p)*1.1;});
    R.render(S,cam);
  };
}
try{world=buildWorld()}catch(err){console.warn('3D background off',err)}

const box=$('#box');
(function loop(t){
  sx+=(px-sx)*.06;sy+=(py-sy)*.06;
  box.style.setProperty('--rx',(-sy*12).toFixed(2)+'deg');
  box.style.setProperty('--ry',(sx*14).toFixed(2)+'deg');
  if(world)world(t);
  requestAnimationFrame(loop);
})(0);

/* AUDIO PLAYER / SOUND */
const Snd=(()=>{
  let ctx,master,pad,cv,dl,nb,au=null,mode='',started=false,on=false,want=true,ss=false,nt=0,st=0,lastP=0,lastF=76;
  try{want=localStorage.getItem('kz_snd')!=='0'}catch(e){}
  const b=$('#snd'),f=m=>440*Math.pow(2,(m-69)/12),SX=60/84/4;
  const CH=[{r:36,p:[52,55,59,62,64],a:[60,64,67,71,72,76,79]},{r:33,p:[52,55,59,60,64],a:[57,60,64,67,69,72,76]}];
  function ui(){
    b.innerHTML='<i class="fa-solid '+(on?'fa-volume-high':'fa-volume-xmark')+'"></i>';
    b.classList.toggle('hint',want&&!started);
  }
  function init(){
    ctx=new(window.AudioContext||window.webkitAudioContext)();
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-22;master=ctx.createGain();master.gain.value=0;master.connect(comp);comp.connect(ctx.destination);
    cv=ctx.createConvolver();const L=ctx.sampleRate*3.6,ir=ctx.createBuffer(2,L,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,2.4)}
    cv.buffer=ir;const wet=ctx.createGain();wet.gain.value=.75;cv.connect(wet);wet.connect(master);
    pad=ctx.createBiquadFilter();pad.type='lowpass';pad.frequency.value=1500;pad.connect(master);pad.connect(cv);
  }
  function toSynth(){if(mode!=='synth'&&on)synth()}
  function play(){
    on=true;ui();
    if(mode==='synth')return synth();
    if(!au){au=new Audio(MUSIC_URL);au.loop=true;au.preload='auto';au.volume=0;au.addEventListener('error',toSynth)}
    mode='file';
    au.play().then(()=>{started=true;au.volume=.5;ui()}).catch(e=>{toSynth()});
  }
  function mute(){on=false;if(au)au.volume=0;ui()}
  b.addEventListener('click',()=>{if(!on){want=true;play()}else{want=false;mute()}});
  ui();
})();

$('#refreshBtn').addEventListener('click',function(){
  this.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Refreshing...';
  setTimeout(()=>{location.replace(location.href.split('?')[0]+'?fresh='+Date.now())},400);
});
})();
</script>
</body>
