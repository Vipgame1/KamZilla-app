    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #050510;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Animated Grid Background */
        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            perspective: 500px;
        }
        .grid-bg::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, transparent 20%, #050510 100%);
        }

        /* 3D Glass Card */
        .glass-card {
            background: rgba(20, 25, 40, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }

        /* 3D App Icon */
        .icon-3d-wrapper {
            width: 110px; height: 110px;
            margin: 0 auto;
            border-radius: 24px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            box-shadow: 
                0 10px 0 #020617,
                0 20px 30px rgba(0,0,0,0.5),
                inset 0 2px 5px rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            position: relative;
            transform: translateZ(20px);
            animation: float 4s ease-in-out infinite;
        }
        .icon-3d-wrapper::before {
            content: ''; position: absolute; inset: -2px; border-radius: 26px;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6); z-index: -1;
            filter: blur(10px); opacity: 0.7;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 3D Download Button */
        .btn-3d {
            background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 18px;
            position: relative;
            top: 0;
            box-shadow: 
                0 8px 0 #1e40af, 
                0 15px 25px rgba(37, 99, 235, 0.4),
                inset 0 2px 2px rgba(255, 255, 255, 0.3);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 1px;
            padding: 16px 0;
            width: 100%;
            border: 1px solid #60a5fa;
        }
        .btn-3d:active {
            top: 6px;
            box-shadow: 
                0 2px 0 #1e40af, 
                0 5px 10px rgba(37, 99, 235, 0.4),
                inset 0 2px 2px rgba(255, 255, 255, 0.3);
        }

        .title-glow {
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>

</body>
